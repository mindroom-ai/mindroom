name: Create CalVer Release

on:
  push:
    branches: [main]
    paths-ignore:
      - macos/appcast.xml

permissions:
  actions: write
  contents: write

# calver-auto-release derives the next patch number from the tags it can see at
# checkout, and its tag push does not fail when the remote already has the tag.
# Concurrent runs would therefore pick the same version and each dispatch a full
# publish set for it, so releases are created one at a time. Queued runs tag the
# then-current main, which still contains the commits of any superseded run.
concurrency:
  group: calver-auto-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create release
        id: create_release
        uses: basnijholt/calver-auto-release@v1.0.8
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Claim release tag
        id: claim_release_tag
        if: steps.create_release.outputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REF: ${{ steps.create_release.outputs.version }}
        run: |
          set -euo pipefail

          # Only the run whose commit the tag points at owns the publish set for
          # that tag, so a lost tag race cannot publish the same version twice.
          tag_object=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_REF}" \
            --jq '.object.type + " " + .object.sha')
          object_type="${tag_object%% *}"
          object_sha="${tag_object##* }"

          if [[ "$object_type" == "tag" ]]; then
            tag_commit=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${object_sha}" --jq '.object.sha')
          else
            tag_commit="$object_sha"
          fi

          if [[ "$tag_commit" == "$GITHUB_SHA" ]]; then
            echo "dispatch=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          compare_status=$(gh api \
            "repos/${GITHUB_REPOSITORY}/compare/${tag_commit}...${GITHUB_SHA}" --jq '.status')

          if [[ "$compare_status" == "behind" ]]; then
            echo "::notice::${RELEASE_REF} (${tag_commit}) already releases ${GITHUB_SHA}; skipping duplicate dispatch."
            echo "dispatch=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::error::${RELEASE_REF} points at ${tag_commit}, which does not contain ${GITHUB_SHA}; this commit is unreleased." >&2
          exit 1

      - name: Dispatch release publishers
        id: dispatch_publishers
        if: steps.claim_release_tag.outputs.dispatch == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_WORKFLOW_REF: ${{ github.ref_name }}
          RELEASE_REF: ${{ steps.create_release.outputs.version }}
        run: |
          set -euo pipefail

          publishers=(
            build-mindroom.yml
            build-platform.yml
            publish-helm-charts.yml
            release.yml
          )

          failed=()
          for workflow in "${publishers[@]}"; do
            if ! gh workflow run "$workflow" --ref "$PUBLISH_WORKFLOW_REF" --field release_ref="$RELEASE_REF"; then
              failed+=("$workflow")
            fi
          done

          if (( ${#failed[@]} > 0 )); then
            echo "::error::Failed to dispatch ${RELEASE_REF} publishers: ${failed[*]}" >&2
            exit 1
          fi
