name: tailnet gateway

on:
  push:
    branches: [main]
    paths:
      - "tailnet-gateway/**"
      - ".github/workflows/tailnet-gateway.yml"
  pull_request:
    branches: [main]
    paths:
      - "tailnet-gateway/**"
      - "src/mindroom/tailnet_ssh/**"
      - "src/mindroom/api/*ssh*.py"
      - "src/mindroom/authorization.py"
      - "src/mindroom/config/tailnet_ssh.py"
      - "src/mindroom/tool_system/placement.py"
      - "src/mindroom/tool_system/sandbox_proxy.py"
      - "src/mindroom/tool_system/worker_routing.py"
      - "src/mindroom/workers/backends/**"
      - "uv.lock"
      - "local/instances/deploy/Dockerfile.mindroom"
      - "tests/test_tailnet_ssh_headscale_e2e.py"
      - ".github/workflows/tailnet-gateway.yml"

permissions:
  contents: read

# A newer push to the same pull request makes older runs obsolete; other events never share a group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  go-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tailnet-gateway
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: tailnet-gateway/go.mod
          cache-dependency-path: tailnet-gateway/go.sum

      - name: Format, vet and race checks
        run: |
          unformatted="$(gofmt -l .)"
          test -z "$unformatted" || { printf 'gofmt would change:\n%s\n' "$unformatted" >&2; exit 1; }
          go vet ./...
          go test -race ./...

  # The gateway image and the worker image in a real tailnet: Headscale, Tailscale clients, and stock SSH clients.
  headscale-e2e:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # The worker image copies LFS assets.
          lfs: true
          persist-credentials: false

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android
          df -h /

      - name: Build gateway and worker images
        run: |
          docker build --progress=plain -t mindroom-tailnet-gateway:e2e -f tailnet-gateway/Dockerfile .
          docker build --progress=plain -t mindroom:e2e -f local/instances/deploy/Dockerfile.mindroom .

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install rsync
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rsync

      - name: Test Shell-reach SSH on a real Headscale tailnet
        env:
          MINDROOM_TAILNET_SSH_E2E: "1"
          MINDROOM_TAILNET_SSH_E2E_GATEWAY_IMAGE: mindroom-tailnet-gateway:e2e
          MINDROOM_TAILNET_SSH_E2E_WORKER_IMAGE: mindroom:e2e
        run: uv run pytest tests/test_tailnet_ssh_headscale_e2e.py -x -n 0 --no-cov -m e2e
