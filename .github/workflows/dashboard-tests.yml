name: dashboard tests

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/dashboard-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/dashboard-tests.yml"

permissions:
  contents: read

# A newer push to the same pull request makes older runs obsolete; other events never share a group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  dashboard:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      # Bun occasionally fails to extract a package tarball the registry cut short; a retry with a clean cache
      # downloads it whole.
      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            PUPPETEER_SKIP_DOWNLOAD=true bun install --frozen-lockfile && exit 0
            echo "::warning::bun install failed on attempt $attempt; retrying with a clean cache"
            bun pm cache rm
          done
          exit 1

      - name: Lint
        run: bun run lint

      - name: Run tests
        run: bun run test --run
