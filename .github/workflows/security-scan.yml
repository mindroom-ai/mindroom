name: security-scan
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# A newer push to the same pull request makes older runs obsolete; other events never share a group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.13
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          # Exporting the lockfile installs nothing, so there is nothing to cache.
          enable-cache: false
      - name: Install pip-audit
        run: pip install pip-audit==2.10.1
      - name: Python dependency audit
        # Audit the locked dependencies; a bare pip-audit checks only its own environment.
        run: |
          uv export --frozen --all-extras --no-hashes --no-emit-project --format requirements-txt --quiet -o "$RUNNER_TEMP/requirements.txt"
          pip-audit --disable-pip --no-deps -r "$RUNNER_TEMP/requirements.txt" || true
      - name: Secret scan (gitleaks)
        run: |
          docker run --rm \
            --network none \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --volume "$PWD:/repo:ro" \
            --workdir /repo \
            zricethezav/gitleaks:v8.18.4@sha256:75bdb2b2f4db213cde0b8295f13a88d6b333091bbfbf3012a4e083d00d31caba \
            detect --no-banner --redact --exit-code 0 --source .
