name: platform tests

on:
  push:
    branches: [main]
    paths:
      - "saas-platform/**"
      - ".github/workflows/platform-backend-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "saas-platform/**"
      - ".github/workflows/platform-backend-tests.yml"

permissions:
  contents: read

# A newer push to the same pull request makes older runs obsolete; other events never share a group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  backend:
    name: platform-backend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # The tests mock Kubernetes; an empty kubeconfig keeps any unmocked kubectl or helm call off real clusters.
      KUBECONFIG: /dev/null
    defaults:
      run:
        working-directory: saas-platform/platform-backend
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.0"
          enable-cache: true
          cache-dependency-glob: saas-platform/platform-backend/uv.lock

      # tests/test_account_deletion_sql.py runs the Supabase migrations on a throwaway server and fails without one.
      - name: Install PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-16
          echo "POSTGRES_BIN_DIR=/usr/lib/postgresql/16/bin" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run --frozen pytest

  frontend:
    name: platform-frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: saas-platform/platform-frontend
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      # Bun occasionally fails to extract a package tarball the registry cut short ("Fail extracting tarball for
      # next"); a retry with a clean cache downloads it whole.
      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            bun install --frozen-lockfile && exit 0
            echo "::warning::bun install failed on attempt $attempt; retrying with a clean cache"
            bun pm cache rm
          done
          exit 1

      - name: Run tests
        run: bun run test
