name: Build Platform

on:
  # Build (no push) on PRs to validate Dockerfiles
  pull_request:
    branches: [main]
    paths:
      - 'saas-platform/**'
      - '.github/workflows/build-platform.yml'
  # Publish release images when dispatched by the CalVer release workflow.
  workflow_dispatch:
    inputs:
      release_ref:
        description: 'Release tag to publish, for example v2026.4.261'
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  REGISTRY_USER: ${{ github.repository_owner }}

# A newer push to the same pull request makes older runs obsolete; other events never share a group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          - name: platform-frontend
            dockerfile: saas-platform/Dockerfile.platform-frontend
            context: .
          - name: platform-backend
            dockerfile: saas-platform/Dockerfile.platform-backend
            context: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_ref || github.ref }}

      - name: Validate release ref
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [[ "${{ inputs.release_ref }}" != v* ]]; then
            echo "release_ref must be a tag starting with 'v', got '${{ inputs.release_ref }}'" >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          buildkitd-flags: --debug
          driver-opts: |
            network=host

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.REGISTRY_USER }}/${{ matrix.service.name }}
          tags: |
            type=ref,event=pr,enable=${{ github.event_name == 'pull_request' }}
            type=sha,format=short,enable=${{ github.event_name == 'pull_request' }}
            type=raw,value=${{ inputs.release_ref }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=amd64,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.context }}/${{ matrix.service.dockerfile }}
          platforms: linux/amd64
          push: ${{ github.event_name == 'workflow_dispatch' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Any job on main can write the Actions cache, so release images import none.
          cache-from: ${{ github.event_name == 'pull_request' && 'type=gha' || '' }}
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1
