name: markdown-code-runner

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# A newer push to the same pull request makes older runs obsolete; other events never share a group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  markdown-code-runner:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Run markdown-code-runner
        env:
          TERM: dumb
          NO_COLOR: 1
        run: |
          uv sync
          uv run python docs/run_markdown_code_runner.py

      # This job runs dependency code, so it never holds a write token; regenerate stale docs locally instead.
      - name: Check that generated docs are up to date
        run: |
          git add -A -- '*.md'
          if ! git diff --cached --quiet; then
            echo "::error::Generated docs are stale. Run 'uv run python docs/run_markdown_code_runner.py' locally and commit the result."
            git diff --cached --stat
            git diff --cached
            exit 1
          fi
