name: markdown-code-runner

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  markdown-code-runner:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Run markdown-code-runner
        env:
          TERM: dumb
          NO_COLOR: 1
        run: |
          uv sync
          uv run python docs/run_markdown_code_runner.py

      # This job runs dependency code, so it never holds a write token; regenerate stale docs locally instead.
      - name: Check that generated docs are up to date
        run: |
          git add -A -- '*.md'
          if ! git diff --cached --quiet; then
            echo "::error::Generated docs are stale. Run 'uv run python docs/run_markdown_code_runner.py' locally and commit the result."
            git diff --cached --stat
            git diff --cached
            exit 1
          fi
