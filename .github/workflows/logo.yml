name: Logo artwork

on:
  push:
    branches: [main]
    paths:
      - assets/logo/**
      - .github/workflows/logo.yml
  pull_request:
    paths:
      - assets/logo/**
      - .github/workflows/logo.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          lfs: true
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.13"
      - name: Test joined edge geometry
        run: >-
          uv run --isolated --no-project --with pytest==8.4.2 pytest
          -c /dev/null -p no:cacheprovider assets/logo/test_geometry.py -q
      - name: Check generated artwork
        run: uv run assets/logo/generate.py --check
