name: pytest

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A newer push to the same pull request makes older runs obsolete; other events never share a group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv sync --all-extras

      - name: Install just for recipe regression tests
        uses: taiki-e/install-action@v2
        with:
          tool: just@1.58.0

      # Content-bundle init scripts must also run with BusyBox applets; those tests fail in CI without it.
      # The voice message tests need ffmpeg and ffprobe and are skipped without them.
      - name: Install BusyBox and ffmpeg for script and voice message tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends busybox ffmpeg

      # The root-squash cases run the init in an unprivileged user namespace, which Ubuntu's AppArmor blocks by default.
      - name: Allow unprivileged user namespaces for content-bundle script tests
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Run full suite on Python 3.13
        if: matrix.python-version == '3.13'
        run: |
          # Ubuntu's AppArmor profile permits the installed Chrome sandbox.
          MINDROOM_TEST_BROWSER_EXECUTABLE="$(command -v google-chrome)" \
            uv run pytest

      # Guards Python 3.14 regressions where synchronous tools could execute successfully and then be recorded as failed during cleanup,
      # and where sandboxed tools lost argument validation behind the output-file wrapper.
      - name: Check tool execution on Python 3.14
        if: matrix.python-version == '3.14'
        run: |
          uv run pytest tests/test_tool_job_execution.py tests/test_tool_job_background_after.py tests/test_tool_hooks.py tests/test_tool_output_files.py

      - name: Check for uncommitted changes
        run: |
          git diff --exit-code || {
            echo "::error::Tests produced uncommitted file changes. Run tests locally and commit the updated files."
            git diff --stat
            exit 1
          }

      # - name: Upload coverage reports to Codecov
      #   uses: codecov/codecov-action@v5
      #   with:
      #     file: ./coverage.xml
      #     flags: unittests
      #     name: codecov-umbrella
      #     token: ${{ secrets.CODECOV_TOKEN }}

  diagnose-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        copy: [1, 2, 3, 4]
    env:
      UV_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.13 && uv sync --all-extras && uv pip install playwright==1.65.1 && uv pip show playwright | head -2
      - name: Run the four failing tests with Playwright 1.65.1
        run: |
          google-chrome --version
          MINDROOM_TEST_BROWSER_EXECUTABLE="$(command -v google-chrome)" uv run --no-sync pytest -n 0 --no-cov -q \
            "tests/test_browser_tool.py::test_computer_browser_upstream_preserves_http_and_local_preview" \
            "tests/test_browser_tool.py::test_worker_browser_plain_http_needs_egress_proxy_connect_to_port_80" \
            "tests/test_browser_tool.py::test_primary_browser_uses_scheme_proxies_beside_an_unused_socks_all_proxy" \
            "tests/test_browser_tool.py::test_hostname_allowlist_proxies_serve_worker_browsers_but_not_the_primary" 2>&1 | tail -15
      - name: Probe the browser tool on real plain-HTTP sites
        if: always()
        run: |
          cat > /tmp/tool_probe.py <<'PY'
          import asyncio, json, sys, tempfile
          from pathlib import Path
          from mindroom.constants import resolve_primary_runtime_paths
          from mindroom.custom_tools.browser import BrowserTools

          async def main():
              label, exe = sys.argv[1:3]
              for url in ["http://httpforever.com/", "http://example.com/"]:
                  with tempfile.TemporaryDirectory() as d:
                      paths = resolve_primary_runtime_paths(
                          config_path=Path(d) / "config.yaml", storage_path=Path(d) / "storage",
                          process_env={"BROWSER_EXECUTABLE_PATH": exe},
                      )
                      tool = BrowserTools(paths)
                      try:
                          result = json.loads(await tool.browser(action="open", targetUrl=url))
                          print(label, url, "OK", result.get("url"), result.get("title"))
                      except Exception as e:
                          print(label, url, "ERR", type(e).__name__, str(e).splitlines()[0])
                      finally:
                          await tool.aclose()
          asyncio.run(main())
          PY
          google-chrome --version; chromium --version
          sudo mkdir -p /etc/opt/chrome/policies/managed
          uv run --no-sync python /tmp/tool_probe.py tool-chrome157 "$(command -v google-chrome)" 2>&1 | grep -E '^tool-'
          uv run --no-sync python /tmp/tool_probe.py tool-chromium157 "$(command -v chromium)" 2>&1 | grep -E '^tool-'
          echo '{"HttpsOnlyMode": "disallowed"}' | sudo tee /etc/opt/chrome/policies/managed/diag.json
          uv run --no-sync python /tmp/tool_probe.py tool-chrome157-policy "$(command -v google-chrome)" 2>&1 | grep -E '^tool-'
