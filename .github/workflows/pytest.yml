name: pytest

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A newer push to the same pull request makes older runs obsolete; other events never share a group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv sync --all-extras

      - name: Install just for recipe regression tests
        uses: taiki-e/install-action@v2
        with:
          tool: just@1.58.0

      # Content-bundle init scripts must also run with BusyBox applets; those tests fail in CI without it.
      # The voice message tests need ffmpeg and ffprobe and are skipped without them.
      - name: Install BusyBox and ffmpeg for script and voice message tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends busybox ffmpeg

      # The root-squash cases run the init in an unprivileged user namespace, which Ubuntu's AppArmor blocks by default.
      - name: Allow unprivileged user namespaces for content-bundle script tests
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Run full suite on Python 3.13
        if: matrix.python-version == '3.13'
        run: |
          # Ubuntu's AppArmor profile permits the installed Chrome sandbox.
          MINDROOM_TEST_BROWSER_EXECUTABLE="$(command -v google-chrome)" \
            uv run pytest

      # Guards Python 3.14 regressions where synchronous tools could execute successfully and then be recorded as failed during cleanup,
      # and where sandboxed tools lost argument validation behind the output-file wrapper.
      - name: Check tool execution on Python 3.14
        if: matrix.python-version == '3.14'
        run: |
          uv run pytest tests/test_tool_job_execution.py tests/test_tool_job_background_after.py tests/test_tool_hooks.py tests/test_tool_output_files.py

      - name: Check for uncommitted changes
        run: |
          git diff --exit-code || {
            echo "::error::Tests produced uncommitted file changes. Run tests locally and commit the updated files."
            git diff --stat
            exit 1
          }

      # - name: Upload coverage reports to Codecov
      #   uses: codecov/codecov-action@v5
      #   with:
      #     file: ./coverage.xml
      #     flags: unittests
      #     name: codecov-umbrella
      #     token: ${{ secrets.CODECOV_TOKEN }}

  diagnose-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UV_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      - name: Inspect Chrome install and policies
        run: |
          set -x
          google-chrome --version || true
          chromium --version || true
          command -v google-chrome chromium chromium-browser || true
          ls -laR /etc/opt/chrome /etc/chromium /etc/chromium-browser 2>&1 || true
          find / -xdev -path '*polic*' -name '*.json' \( -path '*chrom*' -o -path '*chrome*' \) 2>/dev/null | while read -r f; do echo "== $f"; cat "$f"; done
          B=$(readlink -f /opt/google/chrome/chrome); echo "$B"
          strings "$B" | grep -E 'Https(First|Upgrade|Only)' | sort -u | head -80
      - run: uv python install 3.13 && uv sync --all-extras
      - name: Probe plain HTTP navigation
        run: |
          cat > /tmp/diag.py <<'PY'
          import asyncio, json, os, sys, tempfile
          from playwright.async_api import async_playwright
          from tests.browser_egress_helpers import SquidLikeUpstream

          EXE = sys.argv[1]

          async def attempt(label, args, url):
              squid = SquidLikeUpstream()
              proxy = await squid.start()
              async with async_playwright() as p:
                  with tempfile.TemporaryDirectory() as d:
                      ctx = await p.chromium.launch_persistent_context(
                          d, executable_path=EXE, headless=True, args=args, proxy={"server": proxy}
                      )
                      page = ctx.pages[0] if ctx.pages else await ctx.new_page()
                      page.on("request", lambda r: print(label, "request", r.method, r.url, r.is_navigation_request()))
                      page.on("requestfailed", lambda r: print(label, "requestfailed", r.url, r.failure))
                      page.on("framenavigated", lambda f: print(label, "framenavigated", f.url))
                      try:
                          resp = await page.goto(url, timeout=20000)
                          print(label, "OK", resp and resp.status, page.url, await page.title())
                      except Exception as e:
                          print(label, "ERR", str(e).splitlines()[0])
                          try:
                              print(label, "BODY", (await page.inner_text("body"))[:800].replace("\n", " | "))
                          except Exception as e2:
                              print(label, "no body", e2)
                      print(label, "squid requests", squid.requests)
                      if label == "baseline":
                          for u in ["chrome://version", "chrome://policy"]:
                              pg = await ctx.new_page()
                              await pg.goto(u)
                              await pg.wait_for_timeout(1000)
                              print(label, u, (await pg.inner_text("body"))[:4000].replace("\n", " | "))
                          prefs = json.load(open(os.path.join(d, "Default", "Preferences")))
                          print(label, "prefs https keys", {k: v for k, v in prefs.items() if "https" in k.lower()})
                      await ctx.close()
              await squid.close()

          async def main():
              await attempt("baseline", [], "http://8.8.8.8/plain")
              await attempt("hostname", [], "http://allowed.example/plain")
              await attempt("public-name", [], "http://neverssl.com/plain")
          asyncio.run(main())
          PY
          PYTHONPATH=$PWD uv run --no-sync python /tmp/diag.py "$(command -v google-chrome)"
      - name: Run one failing test with Playwright debug logging
        if: always()
        run: |
          DEBUG=pw:browser* MINDROOM_TEST_BROWSER_EXECUTABLE="$(command -v google-chrome)" \
            uv run --no-sync pytest "tests/test_browser_tool.py::test_worker_browser_plain_http_needs_egress_proxy_connect_to_port_80" -n 0 --no-cov -v 2>&1 | tail -150
