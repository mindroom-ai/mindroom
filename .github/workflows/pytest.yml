name: pytest

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv sync --all-extras

      - name: Install just for recipe regression tests
        uses: taiki-e/install-action@v2
        with:
          tool: just@1.58.0

      - name: Run full suite on Python 3.13
        if: matrix.python-version == '3.13'
        run: |
          # Ubuntu's AppArmor profile permits the installed Chrome sandbox.
          MINDROOM_TEST_BROWSER_EXECUTABLE="$(command -v google-chrome)" \
            uv run pytest -m "not requires_matrix"

      - name: Check tool execution on Python 3.14
        if: matrix.python-version == '3.14'
        run: |
          uv run pytest tests/test_tool_job_execution.py tests/test_tool_job_wait_timeout.py tests/test_tool_hooks.py -m "not requires_matrix"

      - name: Check for uncommitted changes
        run: |
          git diff --exit-code || {
            echo "::error::Tests produced uncommitted file changes. Run tests locally and commit the updated files."
            git diff --stat
            exit 1
          }

      # - name: Upload coverage reports to Codecov
