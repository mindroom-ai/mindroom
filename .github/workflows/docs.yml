name: Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync

      - name: Build docs
        run: uv run zensical build

      - name: Verify docs output
        run: test -f site/index.html

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./site"

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke-deployment:
    if: github.event_name != 'pull_request'
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
    steps:
      - name: Test deployed scheduling docs
        id: smoke_deployed_docs
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -euo pipefail

          page_url="${PAGE_URL:?deployment page URL is required}"
          scheduling_url="${page_url%/}/scheduling/"
          output_file=$(mktemp)
          trap 'rm -f "$output_file"' EXIT

          for attempt in $(seq 1 12); do
            if curl \
              --fail \
              --location \
              --silent \
              --show-error \
              --connect-timeout 5 \
              --max-time 10 \
              "$scheduling_url" \
              --output "$output_file" && \
              grep --fixed-strings --quiet "Silent Delivery" "$output_file"; then
              echo "Deployed scheduling docs are live at $scheduling_url"
              exit 0
            fi

            if [[ "$attempt" -lt 12 ]]; then
              echo "Waiting for deployed scheduling docs (attempt $attempt/12)..."
              sleep 5
            fi
          done

          echo "Deployed scheduling docs did not expose Silent Delivery at $scheduling_url" >&2
          exit 1
