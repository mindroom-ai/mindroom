# Local MatrixRTC stack for voice-call end-to-end tests.
# Everything uses host networking; Matrix and the JWT service bind to loopback.
name: mindroom-voicetest

services:
  tuwunel:
    image: ${MINDROOM_TUWUNEL_IMAGE:-ghcr.io/mindroom-ai/mindroom-tuwunel:latest}
    network_mode: host
    environment:
      TUWUNEL_SERVER_NAME: localhost
      TUWUNEL_DATABASE_PATH: /var/lib/tuwunel
      TUWUNEL_ADDRESS: 127.0.0.1
      TUWUNEL_PORT: 8008
      TUWUNEL_ALLOW_REGISTRATION: "true"
      TUWUNEL_YES_I_AM_VERY_VERY_SURE_I_WANT_AN_OPEN_REGISTRATION_SERVER_PRONE_TO_ABUSE: "true"
      TUWUNEL_WELL_KNOWN__SERVER: localhost:443
    volumes:
      - tuwunel_data:/var/lib/tuwunel
    restart: unless-stopped

  # TLS front for the homeserver, needed only by lk-jwt-service's OpenID check.
  caddy:
    image: caddy:2
    network_mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    restart: unless-stopped

  livekit:
    image: ${LIVEKIT_IMAGE:-livekit/livekit-server:latest}
    network_mode: host
    command: ["--config", "/etc/livekit.yaml", "--node-ip", "${LIVEKIT_NODE_IP:?set LIVEKIT_NODE_IP}"]
    environment:
      LIVEKIT_KEYS: "voicetest: ${LIVEKIT_SECRET:?set LIVEKIT_SECRET}"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    restart: unless-stopped

  lk-jwt:
    image: ${LK_JWT_IMAGE:-ghcr.io/element-hq/lk-jwt-service:latest}
    network_mode: host
    environment:
      LIVEKIT_URL: ws://${LIVEKIT_NODE_IP}:7880
      LIVEKIT_KEY: voicetest
      LIVEKIT_SECRET: ${LIVEKIT_SECRET}
      LIVEKIT_JWT_BIND: 127.0.0.1:8781
      LIVEKIT_FULL_ACCESS_HOMESERVERS: localhost
      LIVEKIT_INSECURE_SKIP_VERIFY_TLS: YES_I_KNOW_WHAT_I_AM_DOING
    restart: unless-stopped

volumes:
  tuwunel_data:
  caddy_data:
