<!doctype html>
<html lang="en">
  <title>Worker computer fixture</title>
  <style>
    body { background: #113355; color: white; font: 32px sans-serif; padding: 40px; }
    input { font: 28px sans-serif; }
  </style>
  <h1>Agent computer</h1>
  <p>Same worker. Same browser.</p>
  <input id="shared-input" aria-label="Remote text">
  <p><a id="download" href="/download" download>Download fixture</a></p>
  <output id="typed-value" role="status"></output>
  <input id="upload" type="file" aria-label="Upload fixture" style="display:block;font-size:16px">
  <script>
    document.querySelector('#shared-input').addEventListener('input', (event) => {
      document.querySelector('#typed-value').textContent = event.target.value;
    });
    document.querySelector('#upload').addEventListener('change', async (event) => {
      const file = event.target.files[0];
      window.uploadName = file.name;
      window.uploadContent = await file.text();
    });
  </script>
</html>
