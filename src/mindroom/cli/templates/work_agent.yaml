agents:
  "__AGENT_NAME__":
    display_name: Assistant
    role: Private work assistant for one person, helping them think, recall, write, research, plan, and follow up.
    model: default
    memory_backend: file
    # Each person gets a private copy of the template the first time they talk to the agent.
    private:
      per: user
      template_dir: templates/__AGENT_NAME__
      context_files:
        - AGENTS.md
        - SOUL.md
        - IDENTITY.md
        - USER.md
        - TOOLS.md
    delegate_to:
      - "__AGENT_NAME__"
    skill_learning:
      enabled: true
    tools:
      - file
      - shell
      - memory
      - scheduler
      - matrix_message
      - name: website
        defer: true
    # Unless shell runs in dedicated workers, anyone admitted can use it to read every person's copy.
    # To let everyone on your homeserver use it, replace example.org and uncomment:
    # access:
    #   users:
    #     - "@*:example.org"
