agents:
  "__AGENT_NAME__":
    display_name: Money Helper
    role: Private personal-finance helper for one person, working through their budget, spending, savings goals, debts, and bills with figures they can check.
    model: default
    memory_backend: file
    # Each person gets a private copy of the template the first time they talk to the agent.
    private:
      per: user
      template_dir: templates/__AGENT_NAME__
      context_files:
        - AGENTS.md
        - SOUL.md
        - USER.md
    delegate_to:
      - "__AGENT_NAME__"
    # No shell or python, not even from deployment defaults: unless they run in dedicated workers, they run as MindRoom itself and could read every person's copy.
    include_default_tools: false
    tools:
      - file
      - calculator
      - memory
      - scheduler
      - name: yfinance
        defer: true
      - name: website
        defer: true
    # To let everyone on your homeserver use it, replace example.org and uncomment:
    # access:
    #   users:
    #     - "@*:example.org"
