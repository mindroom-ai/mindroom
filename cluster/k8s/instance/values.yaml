customer: demo
baseDomain: mindroom.chat  # Base domain for all services
platformDomain: ""  # Platform app/API domain when it differs from baseDomain
storage: 10Gi  # More storage for Matrix data
storageClassName: hcloud-volumes  # Override to local cluster storage class (for example `standard` in kind)
storageAccessMode: ReadWriteOnce  # MindRoom storage access mode.
synapseStorageAccessMode: ReadWriteOnce
storagePath: "/mindroom_data"  # Base path inside container for persisted state
# Namespace of the ingress-nginx controller pods, the only pods outside the instance that may reach its service ports.
# kube-hetzner's nginx addon installs into `nginx` unless its ingress_target_namespace is set, so confirm the live
# namespace with `kubectl get pods -A -l app.kubernetes.io/name=ingress-nginx`; provisioned instances take it from
# the platform chart's provisioner.instanceIngressControllerNamespace.
ingressControllerNamespace: ingress-nginx

# Tenants share nodes, so every container bounds its ephemeral storage (writable layer, logs, and emptyDirs).
# Kubelet evicts only the pod that exceeds its limit.
# The primary's limit leaves room for tool extras it installs into the image's virtualenv at runtime;
# sentence_transformers with its torch and CUDA wheels alone unpacks to about 7 GiB on x86_64.
# Ephemeral-storage requests stay small: every tenant's requests count against the node's allocatable ephemeral
# storage, so large ones would leave new tenant pods Pending. They are explicit because a limit without a request
# makes Kubernetes request the full limit.
# Memory and CPU requests sit a little above measured idle use (primary ~250 MiB since v2026.9.396, Synapse ~130 MiB,
# sandbox runner ~80 MiB, each ~10m CPU), because every tenant's requests count against the node and decide how many
# tenants fit.
# The limits absorb bursts such as agent runs and tool installs.
mindroomResources:
  requests:
    memory: "320Mi"
    cpu: "100m"
    ephemeral-storage: "64Mi"
  limits:
    memory: "2Gi"
    cpu: "1000m"
    ephemeral-storage: "16Gi"

synapseResources:
  requests:
    memory: "192Mi"
    cpu: "50m"
    ephemeral-storage: "64Mi"
  limits:
    memory: "2Gi"
    cpu: "1000m"
    ephemeral-storage: "2Gi"

# The sandbox runner runs tenant shell and python code on a writable root filesystem.
sandboxRunnerResources:
  requests:
    memory: "128Mi"
    cpu: "25m"
    ephemeral-storage: "64Mi"
  limits:
    memory: "1Gi"
    cpu: "500m"
    ephemeral-storage: "4Gi"
# Size limit of the sandbox runner's /app/workspace emptyDir; kubelet evicts the pod once usage exceeds it.
sandboxRunnerWorkspaceSizeLimit: 1Gi

# Docker images
mindroom_image: ghcr.io/mindroom-ai/mindroom:latest
mindroom_image_pull_policy: Always
synapse_image: matrixdotorg/synapse:latest
synapse_image_pull_policy: Always
imagePullSecrets: []

matrixOidc:
  enabled: "false"
  issuer: ""
  clientId: "mindroom-synapse"
  clientSecret: ""
administrators: []
roomDefaults:
  joinPolicy: invite
  listed: false
  encrypted: false
  inviteUsers: []
  admins: []
matrixAutoJoinRoomKeys: []
matrixHomeserverStartupTimeoutSeconds: 0  # 0 means wait forever for Matrix at startup.
# Tool code runs in the per-tenant sandbox-runner sidecar.
# Tenants share the mindroom-instances namespace, so the chart refuses dedicated Kubernetes workers; use the runtime chart for those.
workerBackend: static_runner
workerCleanupIntervalSeconds: 30

# API keys and secrets (referenced via Secret in deployment)
# Production provisioner deploys create this Secret outside Helm so secret values
# do not land in Helm release history.
instanceSecrets:
  create: true
  name: ""
  hash: ""
openai_key: ""
anthropic_key: ""
google_key: ""
openrouter_key: ""
deepseek_key: ""
sandbox_proxy_token: ""
credentials_encryption_key: ""
# Dedicated Synapse registration shared secret when Helm creates the instance Secret.
# With instanceSecrets.create=false, populate matrix_registration_shared_secret in the existing instance Secret instead.
matrixRegistrationSharedSecret: ""
# Per-instance key the platform uses to sign dashboard login tickets for this instance.
# With instanceSecrets.create=false, the provisioner writes platform_sso_secret into the existing instance Secret.
platformSsoSecret: ""

# Supabase (shared auth). Tenant workloads get only the public anon key, never the service-role key.
supabaseUrl: ""
supabaseAnonKey: ""
# Without Supabase, the primary gets a generated MINDROOM_API_KEY because sidecar tool code can reach its API on localhost.
# Set true only when other API auth is configured.
allowUnauthenticatedPrimary: false

trustedUpstreamAuth:
  enabled: "false"
  userIdHeader: ""
  emailHeader: ""
  matrixUserIdHeader: ""
  emailToMatrixUserIdTemplate: ""
  emailDomain: ""
  requireJwt: "false"
  jwtHeader: ""
  jwksUrl: ""
  jwtAudience: ""
  jwtIssuer: ""
  jwtEmailClaim: "email"
  jwtUserIdClaim: ""
  jwtMatrixUserIdClaim: ""

# Optional Synapse secret seed for macaroon_secret_key and form_secret in the ConfigMap.
# Also used as the registration-secret fallback when matrixRegistrationSharedSecret is empty.
# Does not create an admin login; use random secret material rather than a login password.
# These ConfigMap fields do not support an existing-Secret reference.
matrix_admin_password: ""
