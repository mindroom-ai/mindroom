customer: demo
baseDomain: mindroom.chat  # Base domain for all services
platformDomain: ""  # Platform app/API domain when it differs from baseDomain
storage: 10Gi  # More storage for Matrix data
storageClassName: hcloud-volumes  # Override to local cluster storage class (for example `standard` in kind)
storageAccessMode: ReadWriteOnce  # MindRoom storage access mode. Set ReadWriteMany for multi-node shared-worker storage.
synapseStorageAccessMode: ReadWriteOnce
storagePath: "/mindroom_data"  # Base path inside container for persisted state

mindroomResources:
  requests:
    memory: "512Mi"
    cpu: "250m"
  limits:
    memory: "2Gi"
    cpu: "1000m"

synapseResources:
  requests:
    memory: "512Mi"
    cpu: "250m"
  limits:
    memory: "2Gi"
    cpu: "1000m"

sandboxRunnerResources:
  requests:
    memory: "256Mi"
    cpu: "100m"
  limits:
    memory: "1Gi"
    cpu: "500m"
sandboxRunnerScratchSizeLimit: 4Gi  # sizeLimit for each sandbox-runner emptyDir scratch volume; exceeding it evicts the pod

# Docker images
mindroom_image: ghcr.io/mindroom-ai/mindroom:latest
mindroom_image_pull_policy: Always
synapse_image: matrixdotorg/synapse:latest
synapse_image_pull_policy: Always
imagePullSecrets: []

matrixOidc:
  enabled: "false"
  issuer: ""
  clientId: "mindroom-synapse"
  clientSecret: ""
administrators: []
roomDefaults:
  joinPolicy: invite
  listed: false
  encrypted: false
  inviteUsers: []
  admins: []
matrixAutoJoinRoomKeys: []
matrixHomeserverStartupTimeoutSeconds: 0  # 0 means wait forever for Matrix at startup.
workerBackend: static_runner  # `static_runner` keeps the shared sidecar; `kubernetes` creates dedicated worker pods
# Dedicated browser/display only: requires kubernetes, user_agent scope and browser worker_tools.
# Configure MINDROOM_COMPUTER_ALLOWED_ORIGINS on the primary runtime; see docs/tools/worker-computer.md.
workerComputerEnabled: false
workerCleanupIntervalSeconds: 30
controlPlaneNodeName: ""  # Optional explicit node pin for the control plane and dedicated workers when using shared ReadWriteOnce storage.
kubernetesWorkerImage: ""  # Defaults to mindroom_image when empty
kubernetesWorkerImagePullPolicy: ""  # Defaults to mindroom_image_pull_policy when empty
kubernetesWorkerServiceAccountName: ""  # ServiceAccount used by dedicated worker pods. Defaults to the namespace `default`.
kubernetesWorkerNamePrefix: "mindroom-worker"
kubernetesWorkerStorageSubpathPrefix: "workers"
kubernetesWorkerPort: 8766
kubernetesWorkerReadyTimeoutSeconds: 60
kubernetesWorkerIdleTimeoutSeconds: 1800
kubernetesWorkerEnableServiceLinks: false
kubernetesWorkerRuntimeClassName: ""  # Optional RuntimeClass applied to every dedicated worker pod.
# Optional node-installed profile applied only to the main worker container.
kubernetesWorkerSeccompProfile: {}

# API keys and secrets (referenced via Secret in deployment)
# Production provisioner deploys create this Secret outside Helm so secret values
# do not land in Helm release history.
instanceSecrets:
  create: true
  name: ""
  hash: ""
openai_key: ""
anthropic_key: ""
google_key: ""
openrouter_key: ""
deepseek_key: ""
sandbox_proxy_token: ""
credentials_encryption_key: ""
# Dedicated Synapse registration shared secret when Helm creates the instance Secret.
# With instanceSecrets.create=false, populate matrix_registration_shared_secret in the existing instance Secret instead.
matrixRegistrationSharedSecret: ""
# Per-instance key the platform uses to sign dashboard login tickets for this instance.
# With instanceSecrets.create=false, the provisioner writes platform_sso_secret into the existing instance Secret.
platformSsoSecret: ""

# Supabase (shared auth). Tenant workloads get only the public anon key, never the service-role key.
supabaseUrl: ""
supabaseAnonKey: ""

trustedUpstreamAuth:
  enabled: "false"
  userIdHeader: ""
  emailHeader: ""
  matrixUserIdHeader: ""
  emailToMatrixUserIdTemplate: ""
  emailDomain: ""
  requireJwt: "false"
  jwtHeader: ""
  jwksUrl: ""
  jwtAudience: ""
  jwtIssuer: ""
  jwtEmailClaim: "email"
  jwtUserIdClaim: ""
  jwtMatrixUserIdClaim: ""

# Optional Synapse secret seed for macaroon_secret_key and form_secret in the ConfigMap.
# Also used as the registration-secret fallback when matrixRegistrationSharedSecret is empty.
# Does not create an admin login; use random secret material rather than a login password.
# These ConfigMap fields do not support an existing-Secret reference.
matrix_admin_password: ""
