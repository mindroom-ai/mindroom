agents:
  mind:
    display_name: Mind
    role: Personal assistant with persistent file-based identity and memory
    model: default
    include_default_tools: false
    learning: false
    memory_backend: file
    rooms:
    - personal
    accept_invites: true
    access:
      current_room_members: false
      members_of_rooms:
      - personal
      users: []
    context_files:
    - SOUL.md
    - AGENTS.md
    - USER.md
    - IDENTITY.md
    - TOOLS.md
    - HEARTBEAT.md
    tools:
    - shell
    - coding
    - memory
    - name: config_manager
      defer: true
    - duckduckgo
    - website
    - browser
    - scheduler
    - todo
    - matrix_message
    - name: thread_model
      defer: true
    - thread_tags
    - thread_summary
    skills:
    - mindroom-docs
    instructions:
    - You wake up fresh each session with no memory of previous conversations. Your context files are already loaded into
      your system prompt.
    - Important long-term context is persisted by the configured MindRoom memory backend. If something must be preserved exactly,
      write or update the relevant file directly.
    - MEMORY.md is curated long-term memory; daily files are short-lived notes and logs.
    - Ask before external or destructive actions.
    - Before answering prior-history questions, use search_memories first.
    - When helping with MindRoom setup, follow AGENTS.md and check the live state — don't guess.
    - Meet the user at their technical level. If they ask you to configure something, do it; skip YAML or shell details unless
      they ask.
    skill_learning:
      enabled: true
router:
  model: luna
  accept_invites: true
mindroom_user:
  username: mindroom_user
  display_name: MindRoomUser
administrators:
- __MINDROOM_OWNER_USER_ID_FROM_PAIRING__
room_defaults:
  join_policy: invite
  listed: false
  invite_users:
  - __MINDROOM_OWNER_USER_ID_FROM_PAIRING__
  admins:
  - __MINDROOM_OWNER_USER_ID_FROM_PAIRING__
matrix_space:
  enabled: true
  name: MindRoom
memory:
  backend: file
  embedder:
    provider: openai
    config:
      model: openai/text-embedding-3-small
      host: https://openrouter.ai/api/v1
      credentials_service: openrouter
      dimensions: 1536
  file:
    max_entrypoint_lines: 200
  search:
    mode: semantic
    include:
    - memory/**/*.md
    include_entrypoint: false
  auto_flush:
    enabled: true
authorization:
  config_command_enabled: false
defaults:
  tools:
  - scheduler
  markdown: true
  compaction:
    enabled: true
voice:
  enabled: true
  stt:
    provider: openai_compatible
    model: openai/gpt-transcribe
    host: https://openrouter.ai/api/v1
    credentials_service: openrouter
