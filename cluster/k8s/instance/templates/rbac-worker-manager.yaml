{{- if eq (.Values.workerBackend | default "static_runner") "kubernetes" }}
{{- $workerManagerServiceAccountName := printf "mindroom-worker-manager-%s" .Values.customer -}}
{{- /*
Worker Deployments and Services are named from the worker key at runtime, so `resourceNames`
cannot scope these verbs and this Role is namespace-wide in a namespace every tenant shares.
`admissionpolicy-worker-manager.yaml` is what confines this ServiceAccount to its own tenant's
worker resources; the Role and that policy must stay in step.
*/ -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mindroom-worker-manager-{{ .Values.customer }}
  namespace: mindroom-instances
  labels:
    app: mindroom
    customer: {{ .Values.customer | quote }}
rules:
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get", "create", "patch", "delete"]
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["mindroom-worker-auth-{{ .Values.customer }}"]
  verbs: ["get", "patch"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "create", "patch", "delete"]
- apiGroups: ["apps"]
  resources: ["replicasets"]
  verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mindroom-worker-manager-{{ .Values.customer }}
  namespace: mindroom-instances
  labels:
    app: mindroom
    customer: {{ .Values.customer | quote }}
subjects:
- kind: ServiceAccount
  name: {{ $workerManagerServiceAccountName }}
  namespace: mindroom-instances
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mindroom-worker-manager-{{ .Values.customer }}
{{- end }}
