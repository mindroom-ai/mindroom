{{- $config := .Files.Get "default-config.yaml" | fromYaml -}}
{{- $_ := set $config "access_model" "room_membership" -}}
{{- $_ := set $config "administrators" (.Values.administrators | default (list)) -}}
{{- $roomDefaultValues := .Values.roomDefaults | default (dict) -}}
{{- $roomDefaults := dict -}}
{{- $_ := set $roomDefaults "join_policy" ($roomDefaultValues.joinPolicy | default "invite") -}}
{{- $_ := set $roomDefaults "listed" ($roomDefaultValues.listed | default false) -}}
{{- $_ := set $roomDefaults "encrypted" ($roomDefaultValues.encrypted | default false) -}}
{{- $_ := set $roomDefaults "invite_users" ($roomDefaultValues.inviteUsers | default (list)) -}}
{{- $_ := set $roomDefaults "admins" ($roomDefaultValues.admins | default (list)) -}}
{{- $_ := set $config "room_defaults" $roomDefaults -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: mindroom-config-{{ .Values.customer }}
  namespace: mindroom-instances
data:
  config.yaml: |
{{ $config | toYaml | indent 4 }}
