{{- if eq (.Values.workerBackend | default "static_runner") "kubernetes" }}
{{- $customer := .Values.customer | toString -}}
{{- $policyName := printf "mindroom-worker-manager-%s" $customer -}}
{{- $username := printf "system:serviceaccount:mindroom-instances:mindroom-worker-manager-%s" $customer -}}
{{- $workerNamePrefix := printf "%s-" (include "mindroom.workerNamePrefix" .Values) -}}
{{- $workerServiceAccountName := .Values.kubernetesWorkerServiceAccountName | default "default" -}}
{{- $controlPlaneNodeName := .Values.controlPlaneNodeName | default "" -}}
{{- $runtimeClassName := .Values.kubernetesWorkerRuntimeClassName | default "" -}}
{{- $ownerDeploymentName := printf "mindroom-%s" $customer -}}
{{- $authSecretName := printf "mindroom-worker-auth-%s" $customer -}}
{{- $storagePvcName := printf "mindroom-storage-%s" $customer -}}
{{- $configMapName := printf "mindroom-config-%s" $customer -}}
{{- /*
Dedicated workers get dynamic names, so the worker-manager Role cannot use `resourceNames` and
is necessarily namespace-wide. Every tenant shares `mindroom-instances`, so RBAC alone would let
one tenant's runtime create, patch or delete another tenant's workloads and mount another
tenant's Secrets and PVCs. This policy is the boundary for those writes: it runs only for this
tenant's ServiceAccount and denies anything but this tenant's own worker Deployments, worker
Services and worker-auth Secret, with worker pods held to the shape the backend generates.
Admission cannot constrain reads, so namespace-wide get/list of pods and Deployments remain.
Requires Kubernetes 1.30+ for admissionregistration.k8s.io/v1.
*/ -}}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $policyName }}
  labels:
    app: mindroom
    customer: {{ $customer | quote }}
spec:
  failurePolicy: Fail
  # Everything this ServiceAccount could ever write is matched, so a later RBAC change cannot
  # silently widen it: the first validation denies every resource the backend does not manage.
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE", "DELETE"]
      resources: ["pods", "services", "endpoints", "secrets", "configmaps", "persistentvolumeclaims", "serviceaccounts"]
    - apiGroups: ["apps"]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE", "DELETE"]
      resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    - apiGroups: ["discovery.k8s.io"]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE", "DELETE"]
      resources: ["endpointslices"]
  matchConditions:
  - name: tenant-worker-manager
    expression: >-
      request.userInfo.username == {{ $username | toJson }}
  variables:
  - name: target
    expression: >-
      object == null ? oldObject : object
  - name: labels
    expression: >-
      has(variables.target.metadata.labels) ? variables.target.metadata.labels : {}
  - name: inspectsSpec
    expression: >-
      request.operation != "DELETE" && request.resource.resource == "deployments"
  - name: podTemplate
    expression: >-
      variables.inspectsSpec ? variables.target.spec.template : null
  - name: podTemplateLabels
    expression: >-
      variables.podTemplate != null && has(variables.podTemplate.metadata)
      && has(variables.podTemplate.metadata.labels) ? variables.podTemplate.metadata.labels : {}
  - name: podTemplateAnnotations
    expression: >-
      variables.podTemplate != null && has(variables.podTemplate.metadata)
      && has(variables.podTemplate.metadata.annotations) ? variables.podTemplate.metadata.annotations : {}
  - name: podSpec
    expression: >-
      variables.podTemplate != null ? variables.podTemplate.spec : null
  - name: podSecurityContext
    expression: >-
      variables.podSpec != null && has(variables.podSpec.securityContext) ? variables.podSpec.securityContext : {}
  - name: containers
    expression: >-
      variables.podSpec == null ? []
      : ((has(variables.podSpec.containers) ? variables.podSpec.containers : [])
      + (has(variables.podSpec.initContainers) ? variables.podSpec.initContainers : [])
      + (has(variables.podSpec.ephemeralContainers) ? variables.podSpec.ephemeralContainers : []))
  - name: volumes
    expression: >-
      variables.podSpec != null && has(variables.podSpec.volumes) ? variables.podSpec.volumes : []
  validations:
  - expression: >-
      (request.resource.group == "apps" && request.resource.resource == "deployments")
      || (request.resource.group == "" && request.resource.resource in ["services", "secrets"])
    message: The MindRoom worker manager may only manage worker Deployments, worker Services and its worker-auth Secret.
    reason: Forbidden
  # Deleting is authorized by the tenant label alone so workers created before this policy
  # existed stay removable; creating and updating additionally require this tenant's own name.
  - expression: >-
      "customer" in variables.labels && variables.labels["customer"] == {{ $customer | toJson }}
    message: The MindRoom worker manager may only manage resources labelled with its own customer.
    reason: Forbidden
  - expression: >-
      request.operation == "DELETE"
      || (request.resource.resource == "secrets"
      ? variables.target.metadata.name == {{ $authSecretName | toJson }}
      : variables.target.metadata.name.startsWith({{ $workerNamePrefix | toJson }}))
    message: The MindRoom worker manager may only create or update its own tenant worker resources.
    reason: Forbidden
  - expression: >-
      request.operation == "DELETE" || !has(variables.target.metadata.ownerReferences)
      || variables.target.metadata.ownerReferences.all(owner,
      owner.apiVersion == "apps/v1" && owner.kind == "Deployment"
      && owner.name == {{ $ownerDeploymentName | toJson }}
      && (!has(owner.blockOwnerDeletion) || owner.blockOwnerDeletion == false))
    message: MindRoom worker resources may only be owned by their own tenant's runtime Deployment.
    reason: Forbidden
  - expression: >-
      !variables.inspectsSpec
      || ("customer" in variables.podTemplateLabels
      && variables.podTemplateLabels["customer"] == {{ $customer | toJson }})
    message: MindRoom worker pod templates must carry their own customer label.
    reason: Forbidden
  - expression: >-
      !variables.inspectsSpec
      || ((!has(variables.podSpec.serviceAccountName)
      || variables.podSpec.serviceAccountName == {{ $workerServiceAccountName | toJson }})
      && (!has(variables.podSpec.serviceAccount)
      || variables.podSpec.serviceAccount == {{ $workerServiceAccountName | toJson }})
      && has(variables.podSpec.automountServiceAccountToken)
      && variables.podSpec.automountServiceAccountToken == false)
    message: MindRoom worker pods must use the configured worker ServiceAccount without an API token.
    reason: Forbidden
  - expression: >-
      !variables.inspectsSpec || variables.volumes.all(volume,
      (has(volume.persistentVolumeClaim)
      && volume.persistentVolumeClaim.claimName == {{ $storagePvcName | toJson }})
      || (has(volume.configMap) && volume.configMap.name == {{ $configMapName | toJson }})
      || (has(volume.secret) && volume.secret.secretName == {{ $authSecretName | toJson }})
      || has(volume.emptyDir))
    message: MindRoom worker pods may only mount their own tenant storage, config and worker-auth volumes.
    reason: Forbidden
  - expression: >-
      !variables.inspectsSpec || variables.containers.all(container,
      (!has(container.env) || container.env.all(entry, !has(entry.valueFrom)
      || ((!has(entry.valueFrom.secretKeyRef)
      || entry.valueFrom.secretKeyRef.name == {{ $authSecretName | toJson }})
      && (!has(entry.valueFrom.configMapKeyRef)
      || entry.valueFrom.configMapKeyRef.name == {{ $configMapName | toJson }}))))
      && (!has(container.envFrom) || container.envFrom.all(source,
      (!has(source.secretRef) || source.secretRef.name == {{ $authSecretName | toJson }})
      && (!has(source.configMapRef) || source.configMapRef.name == {{ $configMapName | toJson }}))))
    message: MindRoom worker containers may only read their own tenant Secret and ConfigMap.
    reason: Forbidden
  # Worker pods run tenant code next to other tenants' pods, so they are held to the
  # Pod Security "restricted" shape the backend already generates.
  - expression: >-
      !variables.inspectsSpec
      || ((!has(variables.podSpec.hostNetwork) || variables.podSpec.hostNetwork == false)
      && (!has(variables.podSpec.hostPID) || variables.podSpec.hostPID == false)
      && (!has(variables.podSpec.hostIPC) || variables.podSpec.hostIPC == false)
      && has(variables.podSecurityContext.runAsNonRoot)
      && variables.podSecurityContext.runAsNonRoot == true
      && has(variables.podSecurityContext.seccompProfile)
      && variables.podSecurityContext.seccompProfile.type in ["RuntimeDefault", "Localhost"]
      && !has(variables.podSecurityContext.seLinuxOptions)
      && (!has(variables.podSecurityContext.appArmorProfile)
      || variables.podSecurityContext.appArmorProfile.type != "Unconfined")
      && !variables.podTemplateAnnotations.exists(key,
      key.startsWith("container.apparmor.security.beta.kubernetes.io/")
      && variables.podTemplateAnnotations[key] == "unconfined"))
    message: MindRoom worker pods must run as non-root with a confined seccomp profile and no host namespaces.
    reason: Forbidden
  - expression: >-
      !variables.inspectsSpec || variables.containers.all(container,
      has(container.securityContext)
      && has(container.securityContext.allowPrivilegeEscalation)
      && container.securityContext.allowPrivilegeEscalation == false
      && has(container.securityContext.capabilities)
      && has(container.securityContext.capabilities.drop)
      && "ALL" in container.securityContext.capabilities.drop
      && (!has(container.securityContext.capabilities.add)
      || size(container.securityContext.capabilities.add) == 0)
      && (!has(container.securityContext.privileged) || container.securityContext.privileged == false)
      && (!has(container.securityContext.runAsNonRoot) || container.securityContext.runAsNonRoot == true)
      && (!has(container.securityContext.seccompProfile)
      || container.securityContext.seccompProfile.type in ["RuntimeDefault", "Localhost"])
      && (!has(container.securityContext.appArmorProfile)
      || container.securityContext.appArmorProfile.type != "Unconfined")
      && !has(container.securityContext.seLinuxOptions)
      && (!has(container.securityContext.procMount) || container.securityContext.procMount == "Default")
      && (!has(container.ports) || container.ports.all(port, !has(port.hostPort) || port.hostPort == 0)))
    message: MindRoom worker containers must drop all capabilities, forbid privilege escalation and bind no host ports.
    reason: Forbidden
  - expression: >-
      !variables.inspectsSpec
      || ({{ if $controlPlaneNodeName }}(!has(variables.podSpec.nodeName)
      || variables.podSpec.nodeName == {{ $controlPlaneNodeName | toJson }}){{ else }}!has(variables.podSpec.nodeName){{ end }}
      && {{ if $runtimeClassName }}(has(variables.podSpec.runtimeClassName)
      && variables.podSpec.runtimeClassName == {{ $runtimeClassName | toJson }}){{ else }}!has(variables.podSpec.runtimeClassName){{ end }}
      && !has(variables.podSpec.priorityClassName)
      && !has(variables.podSpec.priority)
      && !has(variables.podSpec.tolerations)
      && !has(variables.podSpec.imagePullSecrets))
    message: MindRoom worker pods may not choose their node, runtime class, priority, tolerations or pull credentials.
    reason: Forbidden
  - expression: >-
      request.operation == "DELETE" || request.resource.resource != "services"
      || (has(variables.target.spec.selector)
      && "customer" in variables.target.spec.selector
      && variables.target.spec.selector["customer"] == {{ $customer | toJson }}
      && (!has(variables.target.spec.type) || variables.target.spec.type == "ClusterIP")
      && !has(variables.target.spec.externalIPs))
    message: MindRoom worker Services must be ClusterIP Services without external IPs that select their own tenant pods.
    reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $policyName }}
  labels:
    app: mindroom
    customer: {{ $customer | quote }}
spec:
  policyName: {{ $policyName }}
  validationActions: ["Deny"]
{{- end }}
