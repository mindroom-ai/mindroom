{{- if include "mindroom.generatesApiKey" .Values }}
{{- $secretName := printf "mindroom-primary-api-key-%s" (toString .Values.customer) -}}
{{- $apiKey := "" -}}
{{- $existing := lookup "v1" "Secret" "mindroom-instances" $secretName -}}
{{- if and $existing (hasKey $existing.data "MINDROOM_API_KEY") }}
{{- $apiKey = index $existing.data "MINDROOM_API_KEY" | b64dec -}}
{{- else }}
{{- $apiKey = randAlphaNum 48 -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: mindroom-instances
type: Opaque
stringData:
  MINDROOM_API_KEY: {{ $apiKey | quote }}
{{- end }}
