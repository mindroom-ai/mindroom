{{- if and (eq (.Values.workerBackend | default "static_runner") "static_runner") (not .Values.allowUnauthenticatedPrimary) (not (and .Values.supabaseUrl .Values.supabaseAnonKey)) }}
{{- $name := printf "mindroom-primary-api-key-%s" (toString .Values.customer) -}}
{{- $existing := lookup "v1" "Secret" "mindroom-instances" $name -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: mindroom-instances
type: Opaque
data:
  MINDROOM_API_KEY: {{ get ($existing.data | default dict) "MINDROOM_API_KEY" | default (randAlphaNum 48 | b64enc) | quote }}
{{- end }}
