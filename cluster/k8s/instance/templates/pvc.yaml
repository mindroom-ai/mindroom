---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mindroom-storage-{{ .Values.customer }}
  namespace: mindroom-instances
  labels:
    app: mindroom
    customer: {{ .Values.customer | quote }}
spec:
  accessModes:
  - {{ .Values.storageAccessMode | default "ReadWriteOnce" }}
  resources:
    requests:
      storage: {{ .Values.storage }}
  storageClassName: {{ .Values.storageClassName | quote }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tuwunel-storage-{{ .Values.customer }}
  namespace: mindroom-instances
  labels:
    app: tuwunel
    customer: {{ .Values.customer | quote }}
spec:
  accessModes:
  - {{ .Values.tuwunelStorageAccessMode | default "ReadWriteOnce" }}
  resources:
    requests:
      storage: {{ .Values.storage }}
  storageClassName: {{ .Values.storageClassName | quote }}
