{{- if not (hasPrefix "/" .Values.basePath) -}}
{{- fail "basePath must start with /" -}}
{{- end -}}
{{- if and .Values.rootServiceWorkerCleanup.enabled (eq (include "mindroom-client.basePath" .) "/") -}}
{{- fail "rootServiceWorkerCleanup.enabled requires a basePath other than / because /sw.js is the client service worker at the origin root" -}}
{{- end -}}
{{- if contains "$" (.Values.serviceWorker.navigationFallbackExcludePaths | toJson) -}}
{{- fail "serviceWorker.navigationFallbackExcludePaths cannot contain $ because nginx expands variables in return bodies" -}}
{{- end -}}
{{- if .Values.authenticationRecovery.enabled -}}
{{- if or (not .Values.nginx.create) .Values.nginx.existingConfigMap -}}
{{- fail "authenticationRecovery requires the chart-managed nginx config" -}}
{{- end -}}
{{- $recoveryUrls := dict "probeUrl" .Values.authenticationRecovery.probeUrl "navigationUrl" (include "mindroom-client.authenticationRecoveryNavigationUrl" .) -}}
{{- range $name, $url := $recoveryUrls -}}
{{- $lowerUrl := lower $url -}}
{{- if or (not (hasPrefix "/" $url)) (hasPrefix "//" $url) (contains "\\" $url) (contains "$" $url) (regexMatch `[[:cntrl:]]` $url) (contains "%2f" $lowerUrl) (contains "%5c" $lowerUrl) (regexMatch `%0[0-9a-f]|%1[0-9a-f]|%7f` $lowerUrl) (regexMatch `(^|/)(\.|%2e)(\.|%2e)?(/|$|[?#])` $lowerUrl) -}}
{{- fail (printf "authenticationRecovery.%s must be a safe same-origin root-relative URL" $name) -}}
{{- end -}}
{{- end -}}
{{- $recoveryTimeout := .Values.authenticationRecovery.timeoutMs | toString -}}
{{- if not (regexMatch `^[0-9]+$` $recoveryTimeout) -}}
{{- fail "authenticationRecovery.timeoutMs must be an integer from 1000 through 30000" -}}
{{- end -}}
{{- $recoveryTimeoutMs := int .Values.authenticationRecovery.timeoutMs -}}
{{- if or (lt $recoveryTimeoutMs 1000) (gt $recoveryTimeoutMs 30000) -}}
{{- fail "authenticationRecovery.timeoutMs must be an integer from 1000 through 30000" -}}
{{- end -}}
{{- end -}}
{{- if and .Values.config.create (not .Values.config.existingConfigMap) (not .Values.config.data) (not .Values.matrix.homeserverUrl) (not .Values.matrix.defaultServerName) -}}
{{- fail "matrix.homeserverUrl or matrix.defaultServerName is required when the chart renders the default client config" -}}
{{- end -}}
{{- if and (not .Values.config.create) (not .Values.config.existingConfigMap) -}}
{{- fail "config.existingConfigMap is required when config.create=false" -}}
{{- end -}}
{{- if and (not .Values.nginx.create) (not .Values.nginx.existingConfigMap) -}}
{{- fail "nginx.existingConfigMap is required when nginx.create=false" -}}
{{- end -}}
{{- if and .Values.nginx.serverSnippet (or (not .Values.nginx.create) .Values.nginx.existingConfigMap) -}}
{{- fail "nginx.serverSnippet requires the chart-managed nginx config" -}}
{{- end -}}
{{- if and .Values.matrixRTC.enabled (not .Values.matrix.homeserverUrl) -}}
{{- fail "matrix.homeserverUrl is required when matrixRTC.enabled=true" -}}
{{- end -}}
{{- if and .Values.matrixRTC.enabled (not .Values.matrixRTC.livekitServiceUrl) -}}
{{- fail "matrixRTC.livekitServiceUrl is required when matrixRTC.enabled=true" -}}
{{- end -}}
{{- if and .Values.matrixRTC.enabled (or (not .Values.nginx.create) .Values.nginx.existingConfigMap) -}}
{{- fail "matrixRTC.enabled requires the chart-managed nginx config" -}}
{{- end -}}
{{- if and .Values.matrixRTC.proxy.enabled (not .Values.matrixRTC.enabled) -}}
{{- fail "matrixRTC.proxy.enabled requires matrixRTC.enabled=true" -}}
{{- end -}}
{{- if and .Values.matrixRTC.proxy.enabled (not .Values.matrixRTC.proxy.jwtServiceUpstream) -}}
{{- fail "matrixRTC.proxy.jwtServiceUpstream is required when matrixRTC.proxy.enabled=true" -}}
{{- end -}}
{{- if and .Values.matrixRTC.proxy.enabled (not .Values.matrixRTC.proxy.sfuUpstream) -}}
{{- fail "matrixRTC.proxy.sfuUpstream is required when matrixRTC.proxy.enabled=true" -}}
{{- end -}}
