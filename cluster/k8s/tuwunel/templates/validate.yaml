{{- $rendersConfig := and .Values.config.create (not .Values.config.existingConfigMap) -}}
{{- if $rendersConfig -}}
{{- if not .Values.tuwunel.serverName -}}
{{- fail "tuwunel.serverName is required when the chart renders tuwunel.toml" -}}
{{- end -}}
{{- if contains "://" .Values.tuwunel.serverName -}}
{{- fail "tuwunel.serverName must be a bare domain such as example.com, not a URL" -}}
{{- end -}}
{{- if not .Values.tuwunel.listenAddresses -}}
{{- fail "tuwunel.listenAddresses must contain at least one bind address" -}}
{{- end -}}
{{- $managedSettings := list "server_name" "address" "port" "database_path" "log" "well_known" -}}
{{- if .Values.tuwunel.compactEdits -}}
{{- $managedSettings = append $managedSettings "mindroom_compact_edits_enabled" -}}
{{- end -}}
{{- if .Values.tuwunel.registrationToken.existingSecret -}}
{{- $managedSettings = concat $managedSettings (list "allow_registration" "registration_token_file") -}}
{{- end -}}
{{- if .Values.tuwunel.appserviceRegistration.existingSecret -}}
{{- $managedSettings = append $managedSettings "appservice_dir" -}}
{{- end -}}
{{- if .Values.tuwunel.oidc.enabled -}}
{{- $managedSettings = append $managedSettings "identity_provider" -}}
{{- end -}}
{{- range $key, $value := .Values.tuwunel.settings -}}
{{- if and (has $key $managedSettings) (not (kindIs "invalid" $value)) -}}
{{- fail (printf "tuwunel.settings.%s is rendered by the chart; use its dedicated value" $key) -}}
{{- end -}}
{{- end -}}
{{- if .Values.tuwunel.oidc.enabled -}}
{{- if not .Values.tuwunel.oidc.brand -}}
{{- fail "tuwunel.oidc.brand is required when tuwunel.oidc.enabled=true" -}}
{{- end -}}
{{- if not .Values.tuwunel.oidc.clientId -}}
{{- fail "tuwunel.oidc.clientId is required when tuwunel.oidc.enabled=true" -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- if .Values.tuwunel.oidc.enabled -}}
{{- if not .Values.tuwunel.oidc.clientSecret.existingSecret -}}
{{- fail "tuwunel.oidc.clientSecret.existingSecret is required when tuwunel.oidc.enabled=true" -}}
{{- end -}}
{{- if not .Values.tuwunel.oidc.clientSecret.key -}}
{{- fail "tuwunel.oidc.clientSecret.key is required when tuwunel.oidc.enabled=true" -}}
{{- end -}}
{{- end -}}
{{- if and .Values.tuwunel.registrationToken.existingSecret (not .Values.tuwunel.registrationToken.key) -}}
{{- fail "tuwunel.registrationToken.key is required when tuwunel.registrationToken.existingSecret is set" -}}
{{- end -}}
{{- if and .Values.tuwunel.appserviceRegistration.existingSecret (not .Values.tuwunel.appserviceRegistration.key) -}}
{{- fail "tuwunel.appserviceRegistration.key is required when tuwunel.appserviceRegistration.existingSecret is set" -}}
{{- end -}}
{{- if and (not .Values.storage.create) (not .Values.storage.existingClaim) -}}
{{- fail "storage.existingClaim or storage.create=true is required" -}}
{{- end -}}
{{- if and (not .Values.config.create) (not .Values.config.existingConfigMap) -}}
{{- fail "config.existingConfigMap or config.create=true is required" -}}
{{- end -}}
{{- if ne .Values.progressDeadlineSeconds nil -}}
{{- $deadline := toJson .Values.progressDeadlineSeconds -}}
{{- if or (not (regexMatch "^[1-9][0-9]*$" $deadline)) (lt (int64 $deadline) 1) (gt (int64 $deadline) 2147483647) -}}
{{- fail "progressDeadlineSeconds must be a positive integer no greater than 2147483647" -}}
{{- end -}}
{{- end -}}
{{- if and (ne .Values.terminationGracePeriodSeconds nil) (not (regexMatch "^(0|[1-9][0-9]*)$" (toJson .Values.terminationGracePeriodSeconds))) -}}
{{- fail "terminationGracePeriodSeconds must be a non-negative integer" -}}
{{- end -}}
