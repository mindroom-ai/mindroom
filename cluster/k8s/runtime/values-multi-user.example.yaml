# Multi-user MindRoom runtime values
# Copy to values-multi-user.yaml, pair with config-multi-user.example.yaml
# (in the mindroom-config ConfigMap), and replace placeholder values.

# Mount config.yaml read-only from a pre-created ConfigMap.
config:
  create: false
  existingConfigMap: mindroom-config
  key: config.yaml

# Dedicated workers across nodes need RWX storage.
# On RWO-only clusters, keep ReadWriteOnce and set
# workers.kubernetes.colocateWithControlPlaneNode: true below.
# Warning: Kubernetes cannot upgrade a bound RWO PVC to RWX in place;
# create a new RWX claim and migrate data instead.
storage:
  accessModes:
    - ReadWriteMany
  # storageClassName: ""
  size: 50Gi

# Existing Matrix homeserver (deploy cluster/k8s/tuwunel or point at your own).
# For passwordless agent accounts and the optional matrix_user toolkit, switch to:
#   managedAccountAuth: appservice
#   appserviceToken: {existingSecret: mindroom-appservice, key: MATRIX_APPSERVICE_TOKEN}
# and remove registrationToken.
matrix:
  homeserverUrl: http://matrix.example.svc.cluster.local:8008
  serverName: example.com
  registrationToken:
    existingSecret: mindroom-secrets
    key: MATRIX_REGISTRATION_TOKEN

# Provide model-provider keys (for example OPENROUTER_API_KEY) via mindroom-secrets,
# or bind individual keys with providerCredentials.
env:
  envFrom:
    - secretRef:
        name: mindroom-secrets
  # extra:
  #   # Cluster-wide cap on concurrent named workers (default 16); size alongside
  #   # personal_agents.mind.agent.named_workers in config.yaml.
  #   - name: MINDROOM_KUBERNETES_NAMED_WORKERS_MAX
  #     value: "16"
  #   # Required when enabling workers.computerEnabled below.
  #   - name: MINDROOM_COMPUTER_ALLOWED_ORIGINS
  #     value: "https://chat.example.com"

workers:
  backend: kubernetes
  # Opt-in live worker browser view in MindRoom Chat (also set MINDROOM_COMPUTER_ALLOWED_ORIGINS above):
  # computerEnabled: true
  sandbox:
    # Route browser into dedicated Kubernetes workers (do not add browser under static_runner).
    proxyTools: shell,file,python,coding,browser
    proxyToken:
      existingSecret: mindroom-sandbox-proxy
      key: MINDROOM_SANDBOX_PROXY_TOKEN
  kubernetes:
    # colocateWithControlPlaneNode: true  # Required when storage uses ReadWriteOnce
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "2"
        memory: 4Gi

# Agent Keys: inject stored credentials from the primary so workers never hold raw secrets.
egressBroker:
  enabled: true

# Optional: human-approved worker egress proxy + isolated background-script gateway.
# Requires a CNI enforcing Kubernetes NetworkPolicies (workers.kubernetes.networkPolicy.create
# and egressProxy.networkPolicy.create default to true) and a pinned proxy image tag or digest.
# approvedEgress:
#   enabled: true
#   image:
#     tag: v0.1.10  # Pin a released tag or set digest
#   allowlist:
#     domains:
#       - pypi.org
#       - files.pythonhosted.org
# scriptGateway:
#   enabled: true
