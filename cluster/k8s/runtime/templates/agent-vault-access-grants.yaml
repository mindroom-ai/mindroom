{{- $av := .Values.workers.kubernetes.agentVault -}}
{{- $accessGrants := $av.accessGrants -}}
{{- if and $accessGrants.enabled (gt (len $accessGrants.grants) 0) }}
{{- $name := include "mindroom-runtime.agentVaultAccessGrantsName" . -}}
{{- $config := include "mindroom-runtime.agentVaultAccessGrantsConfig" . -}}
{{- $jobSpec := include "mindroom-runtime.agentVaultAccessGrantsJobSpec" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mindroom-runtime.agentVaultAccessGrantsConfigMapName" . }}
  labels:
    {{- include "mindroom-runtime.agentVaultAccessGrantsLabels" . | nindent 4 }}
data:
  access-grants.yaml: |
    {{- $config | nindent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "mindroom-runtime.agentVaultJobName" (list . $name (print $config $jobSpec)) }}
  labels:
    {{- include "mindroom-runtime.agentVaultAccessGrantsLabels" . | nindent 4 }}
  {{- if eq $av.jobNaming "fixed" }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
  {{- end }}
{{ $jobSpec }}
{{- end }}

{{- define "mindroom-runtime.agentVaultAccessGrantsConfig" -}}
{{- $av := .Values.workers.kubernetes.agentVault -}}
{{- $accessGrants := $av.accessGrants -}}
apiUrl: {{ $av.apiUrl | quote }}
vaultNamePrefix: {{ $av.vaultNamePrefix | quote }}
{{- if $accessGrants.tenantId }}
tenantId: {{ $accessGrants.tenantId | quote }}
{{- end }}
{{- if $accessGrants.accountId }}
accountId: {{ $accessGrants.accountId | quote }}
{{- end }}
grants:
  {{- range $grant := $accessGrants.grants }}
  - email: {{ $grant.email | quote }}
    workerScope: {{ $grant.workerScope | quote }}
    {{- if $grant.requester }}
    requester: {{ $grant.requester | quote }}
    {{- end }}
    {{- if $grant.agent }}
    agent: {{ $grant.agent | quote }}
    {{- end }}
    role: {{ default "admin" $grant.role | quote }}
  {{- end }}
{{- end }}

{{- /* With jobNaming=contentHash, each grants config gets its own ConfigMap,
     so each Job reads the grants it was created for, not a later apply's. */ -}}
{{- define "mindroom-runtime.agentVaultAccessGrantsConfigMapName" -}}
{{- $name := include "mindroom-runtime.agentVaultAccessGrantsName" . -}}
{{- include "mindroom-runtime.agentVaultJobName" (list . $name (include "mindroom-runtime.agentVaultAccessGrantsConfig" .)) -}}
{{- end }}

{{- define "mindroom-runtime.agentVaultAccessGrantsJobSpec" -}}
{{- $av := .Values.workers.kubernetes.agentVault -}}
{{- $accessGrants := $av.accessGrants -}}
spec:
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      {{- /* Pod templates are immutable, so version labels stay on the Job and a version-only upgrade keeps the template. */}}
      labels:
        {{- omit (include "mindroom-runtime.agentVaultAccessGrantsLabels" . | fromYaml) "helm.sh/chart" "app.kubernetes.io/version" | toYaml | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: access-grants
          image: {{ include "mindroom-runtime.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy | quote }}
          command:
            - python
            - -m
            - mindroom.agent_vault_access_grants
            - apply
            - --config
            - {{ include "mindroom-runtime.agentVaultAccessGrantsConfigPath" . | quote }}
            - --admin-token-file
            - {{ include "mindroom-runtime.agentVaultAccessGrantsTokenPath" . | quote }}
            - --wait-ready-seconds
            - {{ $accessGrants.waitReadySeconds | quote }}
          resources:
            {{- toYaml $accessGrants.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: access-grants-config
              mountPath: /etc/mindroom-agent-vault-access-grants
              readOnly: true
            - name: access-grants-admin-token
              mountPath: /etc/agent-vault-access-grants
              readOnly: true
      volumes:
        - name: access-grants-config
          configMap:
            name: {{ include "mindroom-runtime.agentVaultAccessGrantsConfigMapName" . }}
        - name: access-grants-admin-token
          secret:
            secretName: {{ $accessGrants.adminTokenSecret.name }}
{{- end }}
