{{- if and (eq .Values.workers.backend "static_runner") (not .Values.apiAuth.allowUnauthenticatedPrimary) }}
{{- $name := printf "%s-api-key" (include "mindroom-runtime.fullname" .) -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "mindroom-runtime.labels" . | nindent 4 }}
type: Opaque
data:
  MINDROOM_API_KEY: {{ get ($existing.data | default dict) "MINDROOM_API_KEY" | default (randAlphaNum 48 | b64enc) | quote }}
{{- end }}
