{{- if include "mindroom-runtime.generatesApiKey" . }}
{{- $secretName := include "mindroom-runtime.apiKeySecretName" . -}}
{{- $apiKey := "" -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- if and $existing (hasKey $existing.data "MINDROOM_API_KEY") }}
{{- $apiKey = index $existing.data "MINDROOM_API_KEY" | b64dec -}}
{{- else }}
{{- $apiKey = randAlphaNum 48 -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "mindroom-runtime.labels" . | nindent 4 }}
type: Opaque
stringData:
  MINDROOM_API_KEY: {{ $apiKey | quote }}
{{- end }}
