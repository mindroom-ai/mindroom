{{- if and .Values.storage.create (not .Values.storage.existingClaim) }}
---
{{ include "mindroom-runtime.persistentVolumeClaim" (list . (include "mindroom-runtime.storageClaimName" .) .Values.storage) }}
{{- end }}
{{- if and .Values.stateStorage.enabled .Values.stateStorage.create (not .Values.stateStorage.existingClaim) }}
---
{{ include "mindroom-runtime.persistentVolumeClaim" (list . (include "mindroom-runtime.stateStorageClaimName" .) .Values.stateStorage) }}
{{- end }}
{{- if and .Values.sessionStorage.enabled (not .Values.sessionStorage.existingClaim) }}
---
{{ include "mindroom-runtime.persistentVolumeClaim" (list . (include "mindroom-runtime.sessionStorageClaimName" .) .Values.sessionStorage) }}
{{- end }}
{{- if and .Values.knowledgeStorage.enabled (not .Values.knowledgeStorage.existingClaim) }}
---
{{ include "mindroom-runtime.persistentVolumeClaim" (list . (include "mindroom-runtime.knowledgeStorageClaimName" .) .Values.knowledgeStorage) }}
{{- end }}
