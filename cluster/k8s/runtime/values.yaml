# Runtime-only MindRoom chart.
# This chart intentionally avoids platform-specific defaults.
# It can create MindRoom runtime storage and event-cache resources, while Matrix, ingress, model gateways, and deployment-specific secrets come from your own cluster.

nameOverride: ""
fullnameOverride: ""

replicaCount: 1
# Optional rollout progress deadline for the MindRoom Deployment, in seconds.
# Leave null to use the Kubernetes default.
progressDeadlineSeconds: null

image:
  repository: ghcr.io/mindroom-ai/mindroom
  tag: latest
  digest: ""
  pullPolicy: Always

# Applied to every chart pod and to dedicated Kubernetes worker pods.
# With a separate workers.kubernetes.namespace, create these Secrets there too; the chart does not copy them.
imagePullSecrets: []

deploymentAnnotations: {}
podAnnotations: {}
podLabels: {}
# Leave empty for the chart default.
# Set this when adopting an existing Deployment whose selector is immutable.
selectorLabels: {}
priorityClassName: ""
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

serviceAccount:
  create: true
  name: ""
  annotations: {}
  automountServiceAccountToken: true

podSecurityContext:
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch

# Applies to every chart container that runs the runtime image: the runtime, the static runner and its storage init container, and the access-grants Job.
# The image runs as uid 1000; runAsNonRoot makes the kubelet enforce that.
securityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8765
  annotations: {}

podDisruptionBudget:
  create: false
  maxUnavailable: 1
  minAvailable: ""

# Optional NetworkPolicy for the MindRoom control-plane pod.
# When created, pod ingress is limited to the runtime API port from the configured peers.
networkPolicy:
  create: false
  name: ""
  # NetworkPolicyPeer entries allowed to reach the runtime API port, for example an edge proxy and known in-cluster clients.
  # NetworkPolicy targets pods rather than Services, so selectors must match the client pods.
  # A bare podSelector only matches pods in the release namespace; combine namespaceSelector and podSelector for cross-namespace clients.
  # Leave empty to allow the API port from all sources while still denying other ingress.
  apiIngressFrom: null
  # Example:
  # apiIngressFrom:
  #   - podSelector:
  #       matchLabels:
  #         app.kubernetes.io/name: my-ingress
  # Raw Kubernetes NetworkPolicyIngressRule entries appended after the API rule.
  extraIngress: null
  # Raw Kubernetes NetworkPolicyEgressRule entries.
  # Setting any entry adds Egress to policyTypes, so include every egress flow the runtime needs.
  extraEgress: null

runtime:
  apiHost: 0.0.0.0
  apiPort: 8765
  logLevel: INFO
  timezone: ""
  timing: false

# Optional listener serving only /api/script-gateway and the capability-authenticated /api/agent-cli routes to dedicated Kubernetes workers.
# Requires workers.backend=kubernetes and the chart's worker egress NetworkPolicy; see "Background Script Gateway" in the README.
scriptGateway:
  enabled: false
  port: 8767

# Optional native credential-injecting egress broker served by the primary on its own port to dedicated Kubernetes workers.
# Requires workers.backend=kubernetes; see "Egress Broker" in the README.
egressBroker:
  enabled: false
  # Listener port on the primary and the egress broker Service; must differ from runtime.apiPort and scriptGateway.port.
  port: 8768
  # Lifetime of the per-call worker tokens; empty keeps the MindRoom default.
  tokenTtlSeconds: ""

config:
  # configMap keeps the existing chart-managed or externally managed ConfigMap behavior.
  # file reads an absolute path that already exists in the runtime filesystem, commonly copied by contentBundles.
  source: configMap
  path: ""
  # Optional native installation before run from one contentBundles entry, whose image digest, sourcePath, and subPath set the revision.
  # Like bootstrapBundlePath, requires source: file, path in its own directory below storage.mountPath, and workers.backend other than
  # the default static_runner. The bundle must keep overwrite enabled, mount no volume at, above, or inside its sourcePath or targetPath,
  # and keep its seed from writing under its targetPath; see "Content Bundles" in the README.
  bootstrapContentBundle:
    # contentBundles[].name to bootstrap from.
    name: ""
    # Directory inside the bundle root holding the config tree; empty means the bundle root.
    subPath: ""
  # Optional explicit source directory for a bootstrap tree that contentBundles does not transport.
  # Cannot be combined with bootstrapContentBundle; initialization runs in the runtime image.
  bootstrapBundlePath: ""
  # Optional opaque revision for bootstrapBundlePath; a new value validates and installs the bootstrap bundle.
  bootstrapBundleRevision: ""
  create: true
  existingConfigMap: ""
  key: config.yaml
  mountPath: /app/config.yaml
  # Leave empty to render the chart's minimal default config, including the event-cache settings below.
  # Set this when you want full control over the generated config file.
  data: ""

eventCache:
  # Backs the durable Matrix event journal. The chart defaults to PostgreSQL
  # because Kubernetes deployments need a restart-safe store; set this to
  # sqlite for lightweight installs.
  #
  # The value keys keep their `eventCache` name so that upgrading this chart
  # does not rename the managed database, its Secret, or its PersistentVolumeClaim.
  backend: postgres
  databaseUrlEnv: MINDROOM_EVENT_CACHE_DATABASE_URL
  databaseUrl:
    # Use this for an externally managed PostgreSQL database, or when adopting an existing Secret for a chart-managed database.
    # The secret should contain a full psycopg-compatible connection string.
    existingSecret: ""
    key: ""
  postgres:
    create: true
    nameOverride: ""
    # Leave empty for the chart default.
    # Set this when adopting an existing StatefulSet whose selector is immutable.
    selectorLabels: {}
    image:
      repository: postgres
      tag: "17"
      pullPolicy: IfNotPresent
    service:
      # Shared by the PostgreSQL listener, probes, Service, and generated connection URL.
      port: 5432
      annotations: {}
    auth:
      database: mindroom_cache
      username: mindroom_cache
      # Existing password Secret for a chart-managed PostgreSQL database.
      existingSecret: ""
      # Leave empty to generate and preserve a random password during Helm upgrades.
      # Set a value for deterministic helm template output.
      password: ""
      passwordKey: password
    persistence:
      enabled: true
      volumeName: data
      # Leave true for chart-created StatefulSets and upgrades.
      # Set false when adopting an existing StatefulSet whose volumeClaimTemplate has no chart labels.
      includeChartLabels: true
      # Extra labels for the StatefulSet volumeClaimTemplates metadata.
      labels: {}
      accessModes:
        - ReadWriteOnce
      storageClassName: ""
      size: 20Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi
    podAnnotations: {}
    podLabels: {}
    podSecurityContext: {}
    securityContext: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
    networkPolicy:
      create: true
      name: ""

storage:
  create: true
  existingClaim: ""
  volumeName: storage
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  size: 10Gi
  mountPath: /app/agent_data

stateStorage:
  # Optional dedicated PVC for restart-critical Matrix client state.
  enabled: false
  create: false
  existingClaim: ""
  volumeName: state-storage
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  size: 10Gi
  mountPath: /app/mindroom_state
  encryptionKeys:
    enabled: true
    mountPath: /app/agent_data/encryption_keys
    subPath: encryption_keys
  syncContinuity:
    enabled: true
    mountPath: /app/agent_data/sync_continuity
    subPath: sync_continuity
  # More state PVC subpaths ({name, mountPath, subPath}) mounted into the runtime container and
  # prepared like the built-in ones; subPath defaults to name. See "Runtime State Storage" in the README.
  extraSubPaths: []
  initPermissions:
    enabled: true
    image: busybox:1.36
    imagePullPolicy: IfNotPresent
    # The init container uses chown/chmod and therefore runs as root by default.
    securityContext:
      runAsUser: 0
      runAsNonRoot: false
      allowPrivilegeEscalation: false
    runAsUser: 1000
    fsGroup: 1000
    chmod: "2775"

sessionStorage:
  # Optional dedicated volume for agent and team session databases.
  # Mounted at mountPath, which the chart passes to MindRoom as MINDROOM_SESSION_STORAGE_PATH.
  # The chart creates a PVC unless existingClaim is set.
  enabled: false
  existingClaim: ""
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  size: 10Gi
  mountPath: /app/session_state

knowledgeStorage:
  # Optional dedicated volume for knowledge-base indexes, including private agents' indexes.
  # Mounted at <storage.mountPath>/knowledge_db, where MindRoom stores them.
  # The chart creates a PVC unless existingClaim is set.
  enabled: false
  existingClaim: ""
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  size: 10Gi

# Immutable content bundles copied into runtime storage before MindRoom starts.
# Bundle images should be pinned by digest and contain files under sourcePath.
# The default target path is <storage.mountPath>/content-bundles/<name>.
contentBundles: []
# Example:
# contentBundles:
#   - name: team-config
#     image: registry.example.com/team/mindroom-config@sha256:1111111111111111111111111111111111111111111111111111111111111111
#     sourcePath: /bundle
#     targetPath: /app/agent_data/content-bundles/team-config
#     seed:
#       enabled: true
#       command:
#         - /app/agent_data/content-bundles/team-config/scripts/seed-content.sh
# Then point MindRoom at a config file copied by the bundle:
# config:
#   source: file
#   path: /app/agent_data/content-bundles/team-config/content/environments/prod/agent-config.yaml

# Model-provider API keys sourced from existing Kubernetes Secrets.
# Each entry binds one Secret key to the provider's native credential env var
# (for example OPENAI_API_KEY); the runtime reads it as that provider's shared
# credential without storing a copy.
# Supported providers mirror PROVIDER_ENV_KEYS in src/mindroom/constants.py:
# anthropic, azure, openai, google, openrouter, deepseek, cerebras, groq, zai, ollama.
providerCredentials: []
# Example:
# providerCredentials:
#   - provider: openai
#     existingSecret: my-llm-secret
#     key: api-key
#   - provider: anthropic
#     existingSecret: my-llm-secret
#     key: anthropic-api-key

# The env lists, extraVolumes, extraVolumeMounts, and the NetworkPolicy
# rule lists accept either a list or a map keyed by entry; see "Layering Values Files" in the README.
# They default to null so Helm accepts either form without table/non-table warnings.
env:
  # Raw Kubernetes EnvVar entries appended to the MindRoom container.
  # String values are rendered with tpl, for example "{{ .Release.Namespace }}".
  extra: null
  # Raw Kubernetes EnvFromSource entries appended to the MindRoom container.
  envFrom: null

apiAuth:
  # Worker tool code can reach the primary API, on localhost from the static_runner sidecar or over the
  # pod network from dedicated Kubernetes workers, so the chart gives the primary a generated MINDROOM_API_KEY;
  # set true only when other API auth is configured.
  allowUnauthenticatedPrimary: false
  # Existing Secret holding the primary's MINDROOM_API_KEY instead of the generated one.
  # Use it with helm template and GitOps tools, where the generated key changes on every offline render.
  # It must be a Secret this chart does not manage, not <fullname>-api-key, which the chart then stops rendering;
  # to keep the current key, copy it from <fullname>-api-key into that Secret first.
  existingSecret: ""
  # Key in existingSecret that holds the API key.
  key: MINDROOM_API_KEY

# Dashboard sign-in through an identity gateway that signs a JWT for each request.
# Each key sets the matching MINDROOM_TRUSTED_UPSTREAM_* variable; see docs/deployment/trusted-upstream-auth.md.
# enabled requires jwtHeader, jwksUrl, jwtAudience, and jwtIssuer, and emailToMatrixUserIdTemplate requires emailDomain.
trustedUpstreamAuth:
  enabled: false
  emailToMatrixUserIdTemplate: ""
  emailDomain: ""
  jwtHeader: ""
  jwksUrl: ""
  jwtAudience: ""
  jwtIssuer: ""
  jwtEmailClaim: email
  jwtUserIdClaim: ""
  jwtMatrixUserIdClaim: ""

matrix:
  homeserverUrl: ""
  serverName: ""
  startupTimeoutSeconds: ""
  # Authentication used only to create/login MindRoom-managed Matrix accounts.
  managedAccountAuth: password
  registrationToken:
    existingSecret: ""
    key: MATRIX_REGISTRATION_TOKEN
  appserviceToken:
    existingSecret: ""
    key: MATRIX_APPSERVICE_TOKEN

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 2Gi

probes:
  # Startup and liveness ask whether the process is up; readiness waits for full bootstrap, including the
  # conversation storage conversion the first start after an upgrade runs.
  startup:
    enabled: true
    custom: {}
    path: /api/health
    port: api
    periodSeconds: 5
    timeoutSeconds: 10
    failureThreshold: 120
  readiness:
    enabled: true
    custom: {}
    path: /api/ready
    port: api
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
  liveness:
    enabled: true
    custom: {}
    path: /api/health
    port: api
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 6

workers:
  # Opt-in visible browser; requires backend=kubernetes, user_agent scope and
  # browser worker_tools. Set MINDROOM_COMPUTER_ALLOWED_ORIGINS via env.extra.
  # See docs/tools/worker-computer.md for trusted Chat origin and WSS routing.
  computerEnabled: false
  # static_runner keeps a sandbox-runner sidecar in this pod.
  # kubernetes lets the MindRoom runtime create worker Deployments on demand.
  backend: static_runner
  cleanupIntervalSeconds: 30
  sandbox:
    executionMode: selective
    proxyTools: shell,file,python,coding
    proxyToken:
      # Prefer existingSecret in production. value creates a chart-managed Secret.
      existingSecret: ""
      key: MINDROOM_SANDBOX_PROXY_TOKEN
      value: ""
    credentialsEncryptionKey:
      # Optional Secret reference used by the primary runtime; the static runner sidecar and dedicated workers never receive it.
      existingSecret: ""
      key: MINDROOM_CREDENTIALS_ENCRYPTION_KEY
  staticRunner:
    port: 8766
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi
  kubernetes:
    namespace: ""
    image:
      repository: ""
      tag: ""
      digest: ""
      pullPolicy: ""
    serviceAccount:
      create: true
      name: ""
      annotations: {}
      automountServiceAccountToken: false
    rbac:
      create: true
    networkPolicy:
      create: true
      name: ""
    port: 8766
    readyTimeoutSeconds: 60
    idleTimeoutSeconds: 1800
    # Recreate scaled-down worker Deployments whose pod template (image, env,
    # resources) drifted from current config during each cleanup interval.
    # Running workers are recreated on their next provisioning after scale-down.
    reconcilePodTemplates: true
    namePrefix: mindroom-worker
    storageSubpathPrefix: workers
    enableServiceLinks: false
    # Optional RuntimeClass applied to every generated worker pod.
    runtimeClassName: ""
    # Optional node-installed profile applied only to the main worker container.
    # Example: {type: Localhost, localhostProfile: profiles/worker-computer.json}
    seccompProfile: {}
    ownerDeploymentName: ""
    nodeName: ""
    colocateWithControlPlaneNode: false
    # Worker env vars as NAME: value; string values are rendered with tpl.
    extraEnv: {}
    extraLabels: {}
    extraAnnotations: {}
    extraContainers: []
    extraVolumes: []
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi
    scriptResources:
      defaultProfile: small
      profiles:
        small:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 1Gi
        standard:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: "1"
            memory: 2Gi
        large:
          requests:
            cpu: 500m
            memory: 2Gi
          limits:
            cpu: "2"
            memory: 8Gi

# Optional external HTTP proxy for dedicated Kubernetes workers.
# This chart can point worker pods at an existing proxy Service and, when
# requested, restrict worker egress so direct internet access must go through
# that proxy.
egressProxy:
  enabled: false
  injectWorkerProxyEnv: true
  service:
    name: mindroom-egress-proxy
    namespace: ""
    port: 3128
    scheme: http
  # Hosts as a list or a map of key to host; a later values file adds a host under a new key or removes
  # one with null. Hosts render in key order and with tpl, for example "api.{{ .Release.Namespace }}.svc.cluster.local".
  noProxy:
    localhost: localhost
    loopback-ipv4: 127.0.0.1
    loopback-ipv6: "::1"
  networkPolicy:
    create: true
    # Labels selecting the existing proxy pods. NetworkPolicy cannot target a Service directly.
    proxyPodSelector: {}
    proxyNamespaceSelector: {}
    # DNS destinations for workers.
    dns:
      namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
      ipBlocks: []
    # Raw Kubernetes NetworkPolicyEgressRule entries appended after DNS and proxy rules.
    extraEgress: null

# Optional chart-managed approved egress proxy for dedicated Kubernetes workers.
# Enabling this deploys the proxy side and automatically points worker proxy
# settings at it. Worker direct egress still depends on the worker NetworkPolicy.
approvedEgress:
  enabled: false
  # Set false when the authored config already wires approved_egress (for example
  # per-agent tool entries) and MindRoom should not add it to defaults at runtime.
  manageRuntimeConfig: true
  image:
    repository: ghcr.io/mindroom-ai/mindroom-egress-proxy
    # Pin a tag or digest before enabling this feature.
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  serviceAccount:
    create: true
    name: ""
    annotations: {}
    automountServiceAccountToken: true
  rbac:
    create: true
  service:
    # Leave empty for <fullname>-egress-proxy.
    name: ""
    proxyPort: 3128
    apiPort: 8080
    annotations: {}
  token:
    # Leave empty to reuse workers.sandbox.proxyToken.
    existingSecret: ""
    key: MINDROOM_SANDBOX_PROXY_TOKEN
  allowlist:
    # Inline domain changes roll the proxy; after editing an existingConfigMap, restart the proxy
    # or set a content hash in podAnnotations. See "Worker Egress Proxy" in the README.
    domains: []
    existingConfigMap: ""
    key: allowed-domains.txt
    mountPath: /etc/mindroom-egress/allowed-domains.txt
  persistence:
    enabled: true
    existingClaim: ""
    size: 10Gi
    storageClassName: ""
  dataPath: /var/lib/mindroom-egress
  dbFileName: grants.sqlite3
  maxTtlSeconds: 21600
  sandboxProxyTimeoutSeconds: ""
  logLevel: info
  # With egressBroker.enabled, Squid forwards token-bearing worker requests to
  # the broker after the normal allowlist/grant check; see "Egress Broker" in the README.
  parentProxy:
    # Route these destinations directly after the normal allowlist/grant check.
    # Use an exact hostname or a leading dot for a domain and its subdomains.
    # Useful for signed URLs that must skip broker credential injection.
    bypassDomains: []
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi
  podAnnotations: {}
  podLabels: {}
  podSecurityContext:
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
  networkPolicy:
    create: true
    name: ""
  # Optional PodDisruptionBudget for the single proxy pod, rendered only when approvedEgress is enabled.
  # It blocks voluntary evictions, such as node drains, while the proxy is ready; see "Worker Egress Proxy" in the README.
  podDisruptionBudget:
    create: false

initContainers: []
extraContainers: []
extraVolumes: null
extraVolumeMounts: null
