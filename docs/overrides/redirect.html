<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>{{ config.site_name }}</title>
    <noscript>
      <meta http-equiv="refresh" content="0;url={{ page.meta.location }}">
    </noscript>
    <script>
      var target = new URL({{ page.meta.location | tojson }}, window.location.href);
      var fragments = {{ (page.meta.fragments or {}) | tojson }};
      var hash = window.location.hash.slice(1);
      if (window.location.search) target.search = window.location.search;
      if (hash) target.hash = Object.prototype.hasOwnProperty.call(fragments, hash) ? fragments[hash] : hash;
      window.location.replace(target.href);
    </script>
  </head>
  <body></body>
</html>
