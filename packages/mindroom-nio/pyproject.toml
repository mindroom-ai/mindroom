[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=61" ]

[project]
name = "mindroom-nio"
version = "1.2.1"
description = "A Python Matrix client library, designed according to sans I/O principles."
readme = "README.md"
license = { file = "LICENSE.md" }
requires-python = ">=3.12"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "aiofiles>=24.1",
  "aiohttp>=3.10",
  "aiohttp-socks>=0.8",
  "h2>=4",
  "h11>=0.14",
  "jsonschema>=4.14",
  "pycryptodome>=3.15",
  "unpaddedbase64>=2.1",
]
[[project.authors]]
name = "Damir Jelić"
email = "poljar@termina.org.uk"

[[project.authors]]
name = "Paarth Shah"
email = "mail@shahpaarth.com"
[project.optional-dependencies]
e2e = [
  "cachetools>=5.3",
  "peewee>=3.14,<5",
  "vodozemac>=0.9.0.post2",
]
# Read the docs specific requirements.
docs = [
  "mindroom-nio[dev]",
  "setuptools>=61",
  "sphinx>=7.4",
  "sphinx-autodoc-typehints~=2.1",
  "sphinx-mdinclude>=0.5",
  "sphinx-rtd-theme>=2",
]
[project.urls]
Source = "https://github.com/mindroom-ai/mindroom-nio"
Documentation = "https://matrix-nio.readthedocs.io/en/latest/"

[dependency-groups]
dev = [
  # aioresponses-ng: maintained fork; upstream aioresponses can't build a mock
  # ClientResponse against aiohttp 3.14+ (missing required `stream_writer`).
  "aioresponses-ng>=0.8.2",
  "faker>=8.16",
  "hpack>=4.1",
  "hyperframe>=6.1",
  "hypothesis>=6.138.3",
  "mindroom-nio[e2e]",
  "mypy>=1.17.1",
  "mypy-extensions>=1.1",
  "pre-commit>=4.3",
  "pytest>=8.4.1",
  "pytest-aiohttp>=0.3",
  "pytest-asyncio>=0.26",
  "pytest-benchmark>=4",
  "pytest-cov>=2.12.1",
  "types-aiofiles>=25.1.0.20260518",
  "types-jsonschema>=4.26.0.20260518",
  "types-peewee>=4.4.0.20260827",
]

[tool.ruff]
target-version = "py312"
extend-exclude = [ "tests" ]
# Honour `exclude` even for paths passed explicitly (e.g. by pre-commit).
force-exclude = true
preview = true
fix = true
show-fixes = true
[tool.ruff.lint]
select = [
  "E",     # pycodestyle
  "F",     # Pyflakes
  "I001",  # isort
  "UP",    # pyupgrade
  "ASYNC", # flake8-async
  "C4",    # flake8-comprehensions
  "T10",   # flake8-debugger
  "FA",    # flake8-future-annotations
  "PT",    # flake8-pytest-style
  "RSE",   # flake8-raise
  "PERF",  # Perflint
  "FURB",  # refurb
]
ignore = [
  "E501", # https://www.flake8rules.com/rules/E501.html - Let `black` handle this.
]
# Allow autofix for all enabled rules (when `--fix`) is provided.
fixable = [ "ALL" ]
unfixable = []
# Exclude a variety of commonly ignored directories.
exclude = [
  ".bzr",
  ".direnv",
  ".eggs",
  ".git",
  ".git-rewrite",
  ".hg",
  ".mypy_cache",
  ".nox",
  ".pants.d",
  ".pytype",
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  "__pypackages__",
  "_build",
  "buck-out",
  "build",
  "dist",
  "node_modules",
  "venv",
  "venv*",
  "tests"
]
[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
  "F401",
  "F403",
  "I001",
]
# Example scripts intentionally use blocking input()/filesystem calls.
"examples/*" = [
  "ASYNC240",
  "ASYNC250",
]

[tool.mypy]
mypy_path = "$MYPY_CONFIG_FILE_DIR/stubs"

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
markers = [
  "expects_anonymous_recovery_clear: exercises the UNKNOWN clear-cause backstop",
]
