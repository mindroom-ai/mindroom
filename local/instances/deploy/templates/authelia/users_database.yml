---
# Authelia users database
# Before starting, configure intended users and replace the public example
# account password and email, or remove/disable that account.
# Generate a new password hash interactively:
# docker run --rm -it authelia/authelia:latest authelia crypto hash generate argon2

users:
  # Example user - CHANGE THIS!
  admin:
    disabled: false
    displayname: "Admin User"
    # Public example hash: replace before starting or exposing the instance.
    password: "$argon2id$v=19$m=1024,t=1,p=8$rqwBHbPanMHvZzrpxxbhVQ$IZPHcoxceCmeRKIroLg14RZbcdamQ1MwKCFGfns8iqo"
    email: admin@example.com
    groups:
      - admins
      - users

  # Add more users as needed:
  # john:
  #   disabled: false
  #   displayname: "John Doe"
  #   password: "$argon2id$..."
  #   email: john@example.com
  #   groups:
  #     - users
