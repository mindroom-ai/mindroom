services:
  mindroom:
    image: ${MINDROOM_IMAGE:-deploy-mindroom:latest}
    build:
      context: ../../..
      dockerfile: local/instances/deploy/Dockerfile.mindroom
    container_name: ${INSTANCE_NAME:-mindroom}-mindroom
    restart: always
    env_file:
      - path: ../../../.env
        required: false
      - path: ${INSTANCE_ENV_FILE}
        required: true
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ${DATA_DIR}/config/config.yaml:/app/config.yaml
      - ${DATA_DIR}/mindroom_data:/app/mindroom_data
      - ${DATA_DIR}/logs:/app/logs
    ports:
      # Loopback only: containers, including the sandbox, reach the host through its bridge gateway.
      - "127.0.0.1:${MINDROOM_PORT:-8765}:8765"
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - MINDROOM_STORAGE_PATH=/app/mindroom_data
      - MINDROOM_SANDBOX_PROXY_URL=http://sandbox-relay:8766
      - MINDROOM_SANDBOX_PROXY_TOKEN=${MINDROOM_SANDBOX_PROXY_TOKEN:?MINDROOM_SANDBOX_PROXY_TOKEN must be set in the instance env file}
      - MINDROOM_SANDBOX_EXECUTION_MODE=selective
      - MINDROOM_SANDBOX_PROXY_TOOLS=shell,file,python
      - HOME=/app
      - MEM0_DIR=/app/mindroom_data/memory/mem0  # Used by mem0
      - MINDROOM_PUBLIC_URL=https://${INSTANCE_DOMAIN}
      - MINDROOM_PORT=${MINDROOM_PORT:-8765}
      - MINDROOM_API_KEY=${MINDROOM_API_KEY:?MINDROOM_API_KEY must be set in the instance env file}
    networks:
      - mindroom-network
      - mynetwork
    labels:
      - traefik.enable=true
      # Dashboard routes go directly to the MindRoom runtime, which now serves the bundled UI
      - traefik.http.routers.${INSTANCE_NAME:-mindroom}.rule=Host(`${INSTANCE_DOMAIN}`)
      - traefik.http.routers.${INSTANCE_NAME:-mindroom}.entrypoints=${TRAEFIK_WEB_ENTRYPOINT:-websecure}
      - traefik.http.routers.${INSTANCE_NAME:-mindroom}.tls=true
      - traefik.http.routers.${INSTANCE_NAME:-mindroom}.tls.certresolver=${TRAEFIK_CERTRESOLVER:-porkbun}
      - traefik.http.routers.${INSTANCE_NAME:-mindroom}.service=${INSTANCE_NAME:-mindroom}
      - traefik.http.routers.${INSTANCE_NAME:-mindroom}.priority=50
      - traefik.http.services.${INSTANCE_NAME:-mindroom}.loadbalancer.server.port=8765
      # OpenAI-compatible /v1 routes go directly to the MindRoom runtime (has its own auth)
      - traefik.http.routers.${INSTANCE_NAME:-mindroom}-v1.rule=Host(`${INSTANCE_DOMAIN}`) && PathPrefix(`/v1`)
      - traefik.http.routers.${INSTANCE_NAME:-mindroom}-v1.entrypoints=${TRAEFIK_WEB_ENTRYPOINT:-websecure}
      - traefik.http.routers.${INSTANCE_NAME:-mindroom}-v1.tls=true
      - traefik.http.routers.${INSTANCE_NAME:-mindroom}-v1.tls.certresolver=${TRAEFIK_CERTRESOLVER:-porkbun}
      - traefik.http.routers.${INSTANCE_NAME:-mindroom}-v1.service=${INSTANCE_NAME:-mindroom}-v1
      - traefik.http.routers.${INSTANCE_NAME:-mindroom}-v1.priority=100
      - traefik.http.services.${INSTANCE_NAME:-mindroom}-v1.loadbalancer.server.port=8765

  sandbox-workspace-init:
    image: ${MINDROOM_IMAGE:-deploy-mindroom:latest}
    build:
      context: ../../..
      dockerfile: local/instances/deploy/Dockerfile.mindroom
    restart: "no"
    user: "0:0"
    command: ["chown", "-R", "${UID:-1000}:${GID:-1000}", "/app/workspace"]
    volumes:
      - sandbox-workspace:/app/workspace
    network_mode: none

  # Shared sidecar: interactive computers require dedicated Docker/Kubernetes
  # workers instead. See docs/tools/worker-computer.md for the opt-in setup.
  sandbox-runner:
    image: ${MINDROOM_IMAGE:-deploy-mindroom:latest}
    build:
      context: ../../..
      dockerfile: local/instances/deploy/Dockerfile.mindroom
    container_name: ${INSTANCE_NAME:-mindroom}-sandbox-runner
    restart: always
    user: "${UID:-1000}:${GID:-1000}"
    command: ["/app/run-sandbox-runner.sh"]
    depends_on:
      sandbox-workspace-init:
        condition: service_completed_successfully
    volumes:
      - sandbox-workspace:/app/workspace
    environment:
      - MINDROOM_SANDBOX_RUNNER_MODE=true
      - MINDROOM_SANDBOX_PROXY_TOKEN=${MINDROOM_SANDBOX_PROXY_TOKEN:?MINDROOM_SANDBOX_PROXY_TOKEN must be set in the instance env file}
      - MINDROOM_CONFIG_PATH=/app/config.yaml
      - MINDROOM_STORAGE_PATH=/app/workspace/.mindroom
    # Tool code runs here, so share no network with the runtime, datastores, or homeserver.
    networks:
      - sandbox-network

  # Forwards only the runner port from the runtime network into the sandbox network.
  sandbox-relay:
    image: busybox:1.36
    container_name: ${INSTANCE_NAME:-mindroom}-sandbox-relay
    restart: always
    user: "65534:65534"
    cap_drop:
      - ALL
    sysctls:
      net.ipv4.ip_forward: 0
    command: ["tcpsvd", "-c", "256", "0.0.0.0", "8766", "nc", "sandbox-runner", "8766"]
    networks:
      - mindroom-network
      - sandbox-network

volumes:
  sandbox-workspace:

networks:
  mindroom-network:
    driver: bridge
    internal: true
  sandbox-network:
    driver: bridge
  mynetwork:
    external: true
